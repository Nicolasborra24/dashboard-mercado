              const vm = mM ? parseNumSeguro(mM[1]) : NaN;
              const va = mA ? parseNumSeguro(mA[1]) : NaN;

      if (!s) return NaN;
      if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
      else if (s.includes(",")) s = s.replace(",", ".");
      const n = parseFloat(s);
      return isNaN(n) ? NaN : n;
    }

    function extraerTIRParaCurva(fila) {
      const keys = Object.keys(fila);
      const kTir = keys.find(k => /^tir$|^tea$|tir_anual|tir\s*\(%\)|tea\s*\(%\)|rendimiento/i.test(k.trim())) || keys.find(k => /tir|tea/i.test(k));
      if (kTir) {
        const v = parseNumSeguro(fila[kTir]);
        if (!isNaN(v) && v !== 0) return v;
      }
      const kTna = keys.find(k => /tna/i.test(k));
      if (kTna) {
        const vTna = parseNumSeguro(fila[kTna]);
        if (!isNaN(vTna) && vTna !== 0) return vTna;
      }
      const kTem = keys.find(k => /tem/i.test(k));
      if (kTem) {
        const vTem = parseNumSeguro(fila[kTem]);
        if (!isNaN(vTem) && vTem > 0) return +(((Math.pow(1 + vTem / 100, 12)) - 1) * 100).toFixed(2);
      }
      return NaN;

    // ============================================================================

    // ============================================================================
    let _ultimoHashCurva = "";
    let _ultimoHashInflacion = "";

    function dibujarGraficoCurva() {
      const canvas = document.getElementById("canvas-curva-bonos");
      if (!canvas) return;

      const filas = obtenerFilasCurva(curvaActiva);
      const puntos = [];

      filas.forEach((f, idx) => {
        const keys = Object.keys(f);
        const kTicker = keys.find(k => /ticker|especie|bono|simbolo/i.test(k)) || keys[0];
        const kDias = keys.find(k => /^dias$|^días$|dias_vto|días_al_vencimiento|plazo/i.test(k.trim())) || keys.find(k => /dias|días/i.test(k));
        const kVto = keys.find(k => /vencimiento|vto|fecha/i.test(k));
        const kDur = keys.find(k => /^md$|duration|duracion/i.test(k));

        const ticker = String(f[kTicker] || `B${idx + 1}`).trim();
        let diasVal = kDias ? parseNumSeguro(f[kDias]) : NaN;

        if (isNaN(diasVal) && kVto && f[kVto]) {
          const sVto = String(f[kVto]).trim();
          let fVto = new Date(sVto);
          if (isNaN(fVto.getTime()) && /^\d{2}\/\d{2}\/\d{4}$/.test(sVto)) {
            const p = sVto.split("/");
            fVto = new Date(`${p[2]}-${p[1]}-${p[0]}`);
          }
          if (!isNaN(fVto.getTime())) diasVal = Math.max(1, Math.round((fVto - new Date()) / 86400000));
        }
        if (isNaN(diasVal) && kDur) {
          const dVal = parseNumSeguro(f[kDur]);
          if (!isNaN(dVal)) diasVal = Math.round(dVal * 365);
        }

        const yVal = extraerTIRParaCurva(f);
        if (!isNaN(diasVal) && !isNaN(yVal) && diasVal > 0 && yVal > -30 && yVal < 250) {
          puntos.push({ x: diasVal, y: yVal, ticker });
        }
      });

      puntos.sort((a, b) => a.x - b.x);

      const lineaTendencia = [];
      if (puntos.length >= 2) {
        const n = puntos.length;
        const xs = puntos.map(p => Math.log(Math.max(1, p.x)));
        const ys = puntos.map(p => p.y);
        const meanX = xs.reduce((a, b) => a + b, 0) / n;
        const meanY = ys.reduce((a, b) => a + b, 0) / n;
        let num = 0, den = 0;
        for (let i = 0; i < n; i++) {
          num += (xs[i] - meanX) * (ys[i] - meanY);
          den += (xs[i] - meanX) ** 2;
        }
        const b = den !== 0 ? num / den : 0;
        const a = meanY - b * meanX;
        const minX = Math.max(1, puntos[0].x);
        const maxX = puntos[puntos.length - 1].x;
        for (let i = 0; i <= 100; i++) {
          const cx = minX + ((maxX - minX) * i) / 100;
          lineaTendencia.push({ x: +cx.toFixed(2), y: +(a + b * Math.log(Math.max(1, cx))).toFixed(2) });
        }
      }

      const hashActual = JSON.stringify({ c: curvaActiva, m: monedaBonosActiva, p: puntos });
      const canvasSigueVivo = chartCurvaInstance && chartCurvaInstance.canvas === canvas && document.body.contains(canvas);

      if (canvasSigueVivo) {
        if (hashActual === _ultimoHashCurva) return;
        _ultimoHashCurva = hashActual;
        chartCurvaInstance.data.datasets[0].data = puntos;
        chartCurvaInstance.data.datasets[1].data = lineaTendencia;
        chartCurvaInstance.update("none");
        return;
      }

      if (chartCurvaInstance) { chartCurvaInstance.destroy(); chartCurvaInstance = null; }
      _ultimoHashCurva = hashActual;

      chartCurvaInstance = new Chart(canvas.getContext("2d"), {
        type: "scatter",
        data: {
          datasets: [

    window.PUNTAS_DOLAR_VIVO = {};

    window.registrarCambioPrecioDolar = function(cod, nuevoCompra, nuevoVenta, varFmt, fecStr, varAnio = null) {
      const prevObj = window.PUNTAS_DOLAR_VIVO[cod] || {};
      const prevVenta = PRECIOS_ANTERIORES[cod] !== undefined ? PRECIOS_ANTERIORES[cod] : prevObj.venta;
      const prevCompra = prevObj.compra;

      if (prevVenta !== undefined && !isNaN(nuevoVenta)) {
        const diffV = Math.abs(Number(nuevoVenta) - Number(prevVenta));
        const diffC = (nuevoCompra && prevCompra) ? Math.abs(Number(nuevoCompra) - Number(prevCompra)) : 0;
        if (diffV >= 0.01 || diffC >= 0.01) {
          if (nuevoVenta > prevVenta || (nuevoCompra && prevCompra && nuevoCompra > prevCompra)) {
            FLASH_REGISTRO[cod] = "flash-green";
          } else {
            FLASH_REGISTRO[cod] = "flash-red";
          }
          setTimeout(() => { FLASH_REGISTRO[cod] = ""; }, 1400);
        } else {
          FLASH_REGISTRO[cod] = "";
        }
      } else {
        FLASH_REGISTRO[cod] = "";
      }

      PRECIOS_ANTERIORES[cod] = nuevoVenta;
      window.PUNTAS_DOLAR_VIVO[cod] = {
        compra: nuevoCompra,
        venta: nuevoVenta,
        variacion: varFmt || prevObj.variacion || "0,00%",
        var_anio: varAnio || prevObj.var_anio || null,
        fecha: fecStr || new Date().toLocaleTimeString()
      };
    };

    window.parsearNodoDolaritoCliente = function(kHint, nd) {
      if (!nd || typeof nd !== "object") return;
      const nom = (kHint + " " + (nd.name || "") + " " + (nd.nombre || "") + " " + (nd.slug || "") + " " + (nd.type || "")).toLowerCase();
      if (/uala|ualá|brubank|nexo|youhodler|arq|prex/.test(nom)) return;
      // PROHIBIDO tocar MEP o CCL con datos de Dolarito
      if (/mep|bolsa|ccl|liqui/.test(nom)) return;

      const c = parseNumSeguro(nd.buy ?? nd.compra ?? nd.bid);
      const v = parseNumSeguro(nd.sell ?? nd.venta ?? nd.value ?? nd.valor ?? nd.ask);
      const vr = parseNumSeguro(nd.variation ?? nd.variacion ?? nd.change ?? nd.var);
      if (isNaN(v) || v < 900 || v > 5000) return;

      let cod = null, soloVenta = false;
      if (/mayorista|a3500|3500|mulc|wholesale/.test(nom)) cod = "DOLAR_A3500";
      else if (/oficial|minorista|bna|nacion/.test(nom) && !/mejor|tarjeta|mayorista/.test(nom)) cod = "DOLAR_OFICIAL";
      else if (/blue|informal|paralelo/.test(nom)) cod = "DOLAR_BLUE";
      else if (/cripto|crypto|usdt/.test(nom)) cod = "DOLAR_CRIPTO";
      else if (/tarjeta|turista/.test(nom)) { cod = "DOLAR_TARJETA"; soloVenta = true; }
      else if (/netflix|streaming/.test(nom)) { cod = "DOLAR_NETFLIX"; soloVenta = true; }
      else if (/futuro|rofex/.test(nom)) cod = "DOLAR_FUTURO";

      if (cod) {
        const prev = window.PUNTAS_DOLAR_VIVO[cod] || {};
        let varFmt = prev.variacion || "0,00%";
        if (!isNaN(vr)) {
          varFmt = vr > 0 ? `+${vr.toFixed(2).replace(".", ",")}%` : (vr < 0 ? `${vr.toFixed(2).replace(".", ",")}%` : "0,00%");
        }
        const cFinal = soloVenta ? null : (!isNaN(c) && c > 900 ? c : prev.compra);
        window.registrarCambioPrecioDolar(cod, cFinal, v, varFmt, new Date().toLocaleTimeString());
      }
    };

    window.extraerDolaresDesdeRavaHTML = function(htmlRaw, bonosPxGlobal, bonosVarGlobal, ravaDirGlobal) {
      if (!htmlRaw || htmlRaw.length < 200) return;
      const htmlU = htmlRaw.replace(/&quot;/g, '"').replace(/\\\//g, '/');
      const regexObj = /\{[^{}]*\}/g;
      let m;
      const bonosPx = bonosPxGlobal || {};
      const bonosVar = bonosVarGlobal || {};
      const ravaDir = ravaDirGlobal || {};

      while ((m = regexObj.exec(htmlU)) !== null) {
        const b = m[0];
        const mSim = b.match(/"(?:simbolo|especie|nombre|identificador|titulo|name)"\s*:\s*"([^"]+)"/i);
        if (!mSim) continue;
        const sim = mSim[1].toUpperCase().trim();
        const mU = b.match(/"(?:ultimo|venta|valor|close|cierre|px_last|last)"\s*:\s*"?([+\-]?[\d\.,]+)"?/i);
        const mD = b.match(/"(?:variacion|var_dia|dia|change|porc|var)"\s*:\s*"?([+\-−]?[\d\.,]+)"?/i);
        const vu = mU ? parseNumSeguro(mU[1]) : NaN;
        const vd = mD ? parseNumSeguro(mD[1]) : NaN;

        const simClean = sim.replace(/\s+(CI|24HS|48HS|SPOT)$/i, "").trim();
        if (["AL30", "AL30D", "AL30C", "GD30", "GD30D", "GD30C"].includes(simClean) && !isNaN(vu) && vu > 15) {
          if (!bonosPx[simClean] || sim === simClean) {
            bonosPx[simClean] = vu;
            if (!isNaN(vd) && vd >= -35 && vd <= 35) bonosVar[simClean] = vd;
          }
        }

        if (!/DOLAR|DÓLAR|MEP|CCL|LIQUI|BOLSA/.test(sim)) continue;
        if (isNaN(vu) || vu < 900 || vu > 5000) continue;

        if (sim.includes("CCL") || sim.includes("LIQUI") || sim.includes("CONTADO")) {
          if (!ravaDir["DOLAR_CCL"] || isNaN(ravaDir["DOLAR_CCL"].varNum)) {
            ravaDir["DOLAR_CCL"] = { venta: vu, varNum: vd };
          }
        } else if (sim.includes("MEP") || sim.includes("BOLSA")) {
          if (!ravaDir["DOLAR_MEP"] || isNaN(ravaDir["DOLAR_MEP"].varNum)) {
            ravaDir["DOLAR_MEP"] = { venta: vu, varNum: vd };
          }
        }
      }

      const calcImpl = (tkArs, tkUsd) => {
        const pA = bonosPx[tkArs], pU = bonosPx[tkUsd];
        if (!pA || !pU || pU <= 0) return null;
        let r = pA / pU;
        if (r < 15) r *= 100;
        else if (r > 50000) r /= 100;
        if (r < 900 || r > 5000) return null;
        let vPct = NaN;
        if (bonosVar[tkArs] !== undefined && bonosVar[tkUsd] !== undefined && (100 + bonosVar[tkUsd]) !== 0) {
          vPct = (((100 + bonosVar[tkArs]) / (100 + bonosVar[tkUsd])) - 1) * 100;
        }
        return { venta: +r.toFixed(2), varNum: vPct };
      };

      const mepCalc = calcImpl("AL30", "AL30D") || calcImpl("GD30", "GD30D") || ravaDir["DOLAR_MEP"];
      if (mepCalc && mepCalc.venta) {
        const vN = !isNaN(mepCalc.varNum) ? mepCalc.varNum : (ravaDir["DOLAR_MEP"] ? ravaDir["DOLAR_MEP"].varNum : NaN);
        const vStr = !isNaN(vN) ? (vN > 0 ? `+${vN.toFixed(2).replace(".", ",")}%` : `${vN.toFixed(2).replace(".", ",")}%`) : (window.PUNTAS_DOLAR_VIVO.DOLAR_MEP.variacion || "0,00%");
        window.registrarCambioPrecioDolar("DOLAR_MEP", null, mepCalc.venta, vStr, "AL30 / AL30D");
      }

      const cclCalc = calcImpl("AL30", "AL30C") || calcImpl("GD30", "GD30C") || ravaDir["DOLAR_CCL"];
      if (cclCalc && cclCalc.venta) {
        const vN = !isNaN(cclCalc.varNum) ? cclCalc.varNum : (ravaDir["DOLAR_CCL"] ? ravaDir["DOLAR_CCL"].varNum : NaN);
        const vStr = !isNaN(vN) ? (vN > 0 ? `+${vN.toFixed(2).replace(".", ",")}%` : `${vN.toFixed(2).replace(".", ",")}%`) : (window.PUNTAS_DOLAR_VIVO.DOLAR_CCL.variacion || "0,00%");
        window.registrarCambioPrecioDolar("DOLAR_CCL", null, cclCalc.venta, vStr, "AL30 / AL30C");
      }
    };

        ]) {

        if ((bonosPx["AL30"] && bonosPx["AL30D"] && bonosPx["AL30C"]) || (ravaDir["DOLAR_MEP"] && ravaDir["DOLAR_CCL"])) {
          break;
        }
      }

// Dólar Cripto sincronizado directamente desde Rava vía /api/dolar/dolarito

        const vOf = window.PUNTAS_DOLAR_VIVO.DOLAR_OFICIAL.venta;
        window.registrarCambioPrecioDolar("DOLAR_TARJETA", null, +(vOf * 1.30).toFixed(2), window.PUNTAS_DOLAR_VIVO.DOLAR_OFICIAL.variacion, new Date().toLocaleTimeString());
        window.registrarCambioPrecioDolar("DOLAR_NETFLIX", null, +(vOf * 1.51).toFixed(2), window.PUNTAS_DOLAR_VIVO.DOLAR_OFICIAL.variacion, new Date().toLocaleTimeString());

      if (dBandas && dBandas.banda_inferior) {
        datosBandasCambiarias = dBandas;

    window.sincronizarCaucionesRava = async function() {
      const ts = Date.now();
      const targetRava = "https://www.rava.com/?_t=" + ts;
      for (const u of [
        "https://corsproxy.io/?" + encodeURIComponent(targetRava),
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(targetRava)
      ]) {
        try {
          const r = await fetch(u, { cache: "no-store" });
          if (!r.ok) continue;
          const htmlTxt = (await r.text()).replace(/&quot;/g, '"');
          const plano = htmlTxt.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
          let hubo = false;
          ["1D", "7D", "14D"].forEach(plz => {
            const reTab = new RegExp("\\bCAUCI[OÓ]N\\s+" + plz + "\\b\\s+([\\d]+[\\.,][\\d]+)\\s+(-|[+\\-−]?[\\d]+[\\.,][\\d]+)\\s+(-|[+\\-−]?[\\d]+[\\.,][\\d]+)\\s+(-|[+\\-−]?[\\d]+[\\.,][\\d]+)", "i");
            const m = plano.match(reTab);
            if (m) {
              const tVal = parseNumSeguro(m[1]);
              if (!isNaN(tVal) && tVal >= 0.5 && tVal <= 150) {
                const cod = "TASA_CAUCION_" + plz;
                const dStr = m[2].trim() === "-" ? "-" : (parseNumSeguro(m[2]) > 0 ? "+" + parseNumSeguro(m[2]).toFixed(1).replace(".", ",") + "%" : parseNumSeguro(m[2]).toFixed(1).replace(".", ",") + "%");
                const mStr = m[3].trim() === "-" ? "-" : (parseNumSeguro(m[3]) > 0 ? "+" + parseNumSeguro(m[3]).toFixed(1).replace(".", ",") + "%" : parseNumSeguro(m[3]).toFixed(1).replace(".", ",") + "%");
                const aStr = m[4].trim() === "-" ? "-" : (parseNumSeguro(m[4]) > 0 ? "+" + parseNumSeguro(m[4]).toFixed(1).replace(".", ",") + "%" : parseNumSeguro(m[4]).toFixed(1).replace(".", ",") + "%");
                if (PRECIOS_ANTERIORES[cod] !== undefined && Math.abs(tVal - PRECIOS_ANTERIORES[cod]) >= 0.01) {
                  FLASH_REGISTRO[cod] = tVal > PRECIOS_ANTERIORES[cod] ? "flash-green" : "flash-red";
                  setTimeout(() => { FLASH_REGISTRO[cod] = ""; }, 1400);
                }
                PRECIOS_ANTERIORES[cod] = tVal;
                if (!datosGlobales.tasas_y_monetario) datosGlobales.tasas_y_monetario = [];
                const idx = datosGlobales.tasas_y_monetario.findIndex(x => x && x.variable === cod);
                const objC = {
                  variable: cod,
                  descripcion: plz === "1D" ? "Caución Bursátil 1 Día (Pesos)" : (plz === "7D" ? "Caución Bursátil 7 Días (Pesos)" : "Caución Bursátil 14 Días (Pesos)"),
                  categoria: "tasas_y_monetario",
                  valor_formateado: tVal.toFixed(2).replace(".", ",") + "% TNA",
                  variacion: dStr,
                  var_mes: mStr,
                  var_anio: aStr,
                  valor: tVal,
                  fecha: "Mes: " + mStr + " | Año: " + aStr
                };
                if (idx >= 0) datosGlobales.tasas_y_monetario[idx] = objC;
                else datosGlobales.tasas_y_monetario.push(objC);
                hubo = true;
              }
            }
          });
          if (hubo) {
            if (categoriaActiva === "tasas_y_monetario") renderizar(false);
            break;
          }
        } catch (e) {}
      }
    };

    window.sincronizarMonedasEnVivo = async function() {
      const ts = Date.now();
      const syms = ["BRL=X", "EURUSD=X", "CLP=X"];
      const quotes = {};

      await Promise.all(syms.map(async sym => {
        const yUrl = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(sym) + "?interval=1d&range=1d&_t=" + ts;
        for (const u of [
          "https://corsproxy.io/?" + encodeURIComponent(yUrl),
          "https://api.allorigins.win/raw?url=" + encodeURIComponent(yUrl)
        ]) {
          try {
            const r = await fetch(u, { cache: "no-store" });
            if (!r.ok) continue;
            const dj = await r.json();
            const meta = dj?.chart?.result?.[0]?.meta;
            if (meta && meta.regularMarketPrice) {
              const p = parseFloat(meta.regularMarketPrice);
              const prev = parseFloat(meta.chartPreviousClose || meta.previousClose || p);
              const chg = prev ? ((p - prev) / prev) * 100 : 0;
              quotes[sym] = { price: p, chg: chg };
              break;
            }
          } catch (e) {}
        }
      }));

      const mayObj = (window.PUNTAS_DOLAR_VIVO && window.PUNTAS_DOLAR_VIVO.DOLAR_A3500) || {};
      const usdArs = parseFloat(mayObj.venta) || 1544.00;
      const chgUsdArs = parseNumSeguro(mayObj.variacion) || 0;
      const horaStr = new Date().toLocaleTimeString();

      const actualizarItemMoneda = (cod, desc, valNum, fmtStr, chgPct) => {
        if (!valNum || isNaN(valNum)) return;
        const varStr = chgPct > 0 ? `+${chgPct.toFixed(2).replace(".", ",")}%` : (chgPct < 0 ? `${chgPct.toFixed(2).replace(".", ",")}%` : "0,00%");
        if (PRECIOS_ANTERIORES[cod] !== undefined && Math.abs(valNum - PRECIOS_ANTERIORES[cod]) >= 0.0001) {
          FLASH_REGISTRO[cod] = valNum > PRECIOS_ANTERIORES[cod] ? "flash-green" : "flash-red";
          setTimeout(() => { FLASH_REGISTRO[cod] = ""; }, 1400);
        }
        PRECIOS_ANTERIORES[cod] = valNum;
        if (!datosGlobales.monedas) datosGlobales.monedas = [];
        const idx = datosGlobales.monedas.findIndex(x => x && x.variable === cod);
        const item = {
          variable: cod,
          descripcion: desc,
          categoria: "monedas",
          valor_formateado: fmtStr,
          variacion: varStr,
          valor: valNum,
          fecha: horaStr
        };
        if (idx >= 0) datosGlobales.monedas[idx] = item;
        else datosGlobales.monedas.push(item);
      };

      const fmtArs = n => "$" + Number(n).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ARS";
      actualizarItemMoneda("MONEDA_USDARS", "Dólar vs Peso Argentino (USD/ARS)", usdArs, fmtArs(usdArs), chgUsdArs);

      if (quotes["BRL=X"]) {
        const pBrl = +quotes["BRL=X"].price.toFixed(4);
        actualizarItemMoneda("MONEDA_USDBRL", "Dólar vs Real Brasileño (USD/BRL)", pBrl, "R$ " + pBrl.toFixed(4).replace(".", ","), quotes["BRL=X"].chg);
      }
      if (quotes["EURUSD=X"]) {
        const pEur = +quotes["EURUSD=X"].price.toFixed(4);
        const cEur = quotes["EURUSD=X"].chg;
        actualizarItemMoneda("MONEDA_EURUSD", "Euro vs Dólar (EUR/USD)", pEur, pEur.toFixed(4).replace(".", ",") + " USD", cEur);
        const pEurArs = +(pEur * usdArs).toFixed(2);
        const cEurArs = ((1 + cEur / 100) * (1 + chgUsdArs / 100) - 1) * 100;
        actualizarItemMoneda("MONEDA_EURARS", "Euro vs Peso Argentino (EUR/ARS)", pEurArs, fmtArs(pEurArs), cEurArs);
      }
      if (quotes["CLP=X"]) {
        const pClp = +quotes["CLP=X"].price.toFixed(2);
        const fmtClp = "CLP$ " + pClp.toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        actualizarItemMoneda("MONEDA_USDCLP", "Dólar vs Peso Chileno (USD/CLP)", pClp, fmtClp, quotes["CLP=X"].chg);
      }

      if (categoriaActiva === "monedas") renderizar(false);
    };

    async function cargarDatos() {
      const data = await fetchJsonSeguro("/bcra/variables?formato=agrupado&t=" + Date.now());
      if (!data) return;
      for (const cat in data) {
        if (cat === "cripto" || !Array.isArray(data[cat]) || data[cat].length === 0) continue;
        data[cat].forEach(item => {
          if (item && item.variable === "RIESGO_PAIS" && (Date.now() - (window._RP_RAVA_BROWSER_TS || 0) < 20000)) {
            const curRp = (datosGlobales.indices || []).find(x => x && x.variable === "RIESGO_PAIS");
            if (curRp) Object.assign(item, curRp);
            return;
          }
          if (item && item.variable && item.valor !== undefined) {
            const k = item.variable, v = parseFloat(item.valor);
            if (PRECIOS_ANTERIORES[k] !== undefined && !isNaN(v)) {
              if (Math.abs(v - PRECIOS_ANTERIORES[k]) >= 0.01) {
                FLASH_REGISTRO[k] = v > PRECIOS_ANTERIORES[k] ? "flash-green" : "flash-red";
                setTimeout(() => { FLASH_REGISTRO[k] = ""; }, 1400);
              } else {
                FLASH_REGISTRO[k] = "";
              }
            }
            PRECIOS_ANTERIORES[k] = v;
          }
        });
        datosGlobales[cat] = data[cat];
      }
      renderizar(false);
      const reloj = document.getElementById("last-update");
      if (reloj) reloj.innerText = new Date().toLocaleTimeString();

      if (badgeSync) {
        badgeSync.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Sincronizado';
      }
    }

    function valorParaOrdenar(item, col) {
      const val = item[col];
      if (val === undefined || val === null || val === "-") return -999999;
      if (typeof val === "number") return val;
      const s = String(val).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s).getTime();
      const numMatch = s.replace(",", ".").match(/-?\d+(\.\d+)?/);
      return numMatch ? parseFloat(numMatch[0]) : s.toLowerCase();
    }

    function ordenarTabla(tablaKey, colKey) {
      if (!SORT_STATE[tablaKey]) SORT_STATE[tablaKey] = { col: null, asc: true };
      const st = SORT_STATE[tablaKey];
      if (st.col === colKey) st.asc = !st.asc;
      else { st.col = colKey; st.asc = true; }
      renderizar(true);
    }

      if (!raw || typeof raw !== "object") return null;
      const fRaw = String(raw.fecha || raw.fechaLicitacion || raw.start || raw.date || raw.fechaInicio || raw.dia || "").trim();
      const hIni = String(raw.horaInicio || raw.desde || raw.startTime || "").trim();
      const hFin = String(raw.horaFin || raw.hasta || raw.endTime || "").trim();
      let horario = String(raw.horario || raw.hora || "").trim();
      if (!horario) {
        if (hIni && hFin) horario = hIni.slice(0, 5) + " - " + hFin.slice(0, 5);
        else if (fRaw.includes("T")) {
          const hExt = fRaw.split("T")[1].slice(0, 5);
          const fEnd = String(raw.end || raw.fechaFin || "");
          const hEnd = fEnd.includes("T") ? fEnd.split("T")[1].slice(0, 5) : "16:00";
          horario = hExt !== "00:00" ? (hExt + " - " + hEnd) : "10:00 - 15:00";
        } else {
          horario = "10:00 - 15:00";
        }
      }
      let fechaIso = "";
      const partesFecha = fRaw.split("T")[0].split(/[-/]/);
      if (partesFecha.length === 3) {
        if (partesFecha[0].length === 4) {
          fechaIso = partesFecha[0] + "-" + partesFecha[1].padStart(2, "0") + "-" + partesFecha[2].padStart(2, "0");

    window.parsearCalendarioFullJSCliente = function(jsText) {
      const extraidos = [];
      if (!jsText || jsText.length < 50) return extraidos;
      const bloques = jsText.match(/\{[^{}]+\}/g) || [];
      bloques.forEach(b => {
        let fIso = "";
        const mND = b.match(/new\s+Date\s*\(\s*(20\d{2})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})/);
        if (mND) {
          const yr = parseInt(mND[1], 10);
          const mo = parseInt(mND[2], 10) + 1;
          const dy = parseInt(mND[3], 10);
          if (mo >= 1 && mo <= 12 && dy >= 1 && dy <= 31) {
            fIso = yr + "-" + String(mo).padStart(2, "0") + "-" + String(dy).padStart(2, "0");
          }
        }
        if (!fIso) {
          const mIso = b.match(/(?:start|fecha|date|dia)\s*[:=]\s*['"](20\d{2})[-/](\d{1,2})[-/](\d{1,2})/i);
          if (mIso) fIso = mIso[1] + "-" + String(mIso[2]).padStart(2, "0") + "-" + String(mIso[3]).padStart(2, "0");
        }
        if (!fIso) {
          const mLat = b.match(/(?:start|fecha|date|dia)\s*[:=]\s*['"](\d{1,2})[-/](\d{1,2})[-/](20\d{2})/i);
          if (mLat) fIso = mLat[3] + "-" + String(mLat[2]).padStart(2, "0") + "-" + String(mLat[1]).padStart(2, "0");
        }
        const mTit = b.match(/(?:title|titulo|descripcion|nombre|text)\s*[:=]\s*['"]([^'"]{6,})['"]/i);
        if (fIso && mTit) {
          const tmp = document.createElement("div");
          tmp.innerHTML = mTit[1];
          const limpio = (tmp.textContent || tmp.innerText || "").trim();
          if (limpio.length > 5) {
            extraidos.push({ fecha: fIso, hora: "16:00hs", publicacion: limpio, url: "https://www.indec.gob.ar/indec/web/Calendario-Fecha-0" });
          }
        }
      });
      return extraidos;
    };

                const cur = String(ev.country || ev.currency || ev.div || ev.country_code || "").toUpperCase().trim();
                const cId = String(ev.country_id || ev.countryId || "");
                if (cur && !["USD", "US", "USA", "UNITED STATES", "EE.UU.", "ESTADOS UNIDOS"].includes(cur) && cId !== "5") return;
                if (!cur && cId && cId !== "5") return;
                const nomRaw = String(ev.long_name || ev.short_name || ev.title || ev.event || ev.name || "").trim();
                const nom = tradMap[nomRaw] || nomRaw;
                const rawIsoEv = String(ev.dateUtc || ev.occurrence_time || ev.date || ev.fecha || ev.datetime || "");
                let fRaw = rawIsoEv.slice(0, 10);
                let horaAr = String(ev.hora || "10:30");
                if (rawIsoEv.includes("T")) {
                  const dtObj = new Date(rawIsoEv);
                  if (!isNaN(dtObj.getTime())) {
                    const strArIso = dtObj.toLocaleString("sv-SE", { timeZone: "America/Argentina/Buenos_Aires" });
                    fRaw = strArIso.slice(0, 10);
                    horaAr = strArIso.slice(11, 16);
                  }
                }
                const impRaw = String(ev.volatility || ev.importance || ev.impact || "2").toLowerCase();
                if (impRaw === "holiday" || impRaw === "non-economic" || impRaw === "0") return;
                const impNum = (impRaw === "high" || impRaw === "3") ? 3 : ((impRaw === "low" || impRaw === "1") ? 1 : 2);
                if (nom && /^202\d-\d{2}-\d{2}$/.test(fRaw)) {
                  const kU = fRaw + "|" + horaAr + "|" + nom;
                  const un = ev.unit || "";
                  const actStr = ev.actual !== null && ev.actual !== undefined && ev.actual !== "" ? String(ev.actual).replace(".", ",") + un : ((mapU[kU] && mapU[kU].actual) || "-");
                  const prevStr = (ev.forecast || ev.consensus) ? String(ev.forecast || ev.consensus).replace(".", ",") + un : ((mapU[kU] && mapU[kU].prevision) || "-");
                  const antStr = ev.previous ? String(ev.previous).replace(".", ",") + un : ((mapU[kU] && mapU[kU].anterior) || "-");
                  mapU[kU] = {
                    fecha: fRaw,
                    hora: horaAr,
                    div: "US",
                    evento: nom,
                    importancia: impNum,
                    actual: actStr,
                    prevision: prevStr,
                    anterior: antStr
                  };
                  huboNuevosUsa = true;
                }
              });
            }
          }
        } catch (e) {}
      }
      if (huboNuevosUsa) {
        window.CALENDARIO_USA_DATA = Object.values(mapU).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
      }
      if (categoriaActiva === "calendario_economico") renderizar(true);
    };

    function filtrarCategoria(cat, ev) {
      categoriaActiva = cat;
      document.querySelectorAll(".nav-tab").forEach(b => b.classList.remove("active"));
      if (ev && ev.currentTarget) ev.currentTarget.classList.add("active");
      if (cat === "calendario_economico" && window.sincronizarCalendarioEconomico) window.sincronizarCalendarioEconomico();
      renderizar(true);
    }

    // Arranque inmediato + Scheduler Inteligente (pausa en segundo plano y evita requests solapados en móvil)
    const _tareasEnCurso = {};
    async function ejecutarSinSolapar(clave, fn) {
      if (typeof fn !== "function" || _tareasEnCurso[clave]) return;
      _tareasEnCurso[clave] = true;
      try { await fn(); } catch (e) {} finally { _tareasEnCurso[clave] = false; }
    }

    window._RP_RAVA_BROWSER_TS = 0;
    window.sincronizarRiesgoPaisRava = async function() {
      const ts = Date.now();
      let rpUlt = NaN, rpDia = NaN, rpMes = NaN, rpAnio = NaN;
      let mArsUlt = NaN, mArsDia = NaN, mArsMes = NaN, mArsAnio = NaN;
      let mUsdUlt = NaN, mUsdDia = NaN, mUsdMes = NaN, mUsdAnio = NaN;

      // 1. Consultar endpoint dedicado en vivo del backend
      const rpBack = await fetchJsonSeguro("/api/riesgo-pais?t=" + ts);
      if (rpBack && rpBack.valor && rpBack.valor >= 100 && rpBack.valor <= 5000) {
        rpUlt = parseFloat(rpBack.valor);
        rpDia = parseNumSeguro(rpBack.variacion);
        rpMes = parseNumSeguro(rpBack.var_mes);
        rpAnio = parseNumSeguro(rpBack.var_anio);
      }

      // 2. Contraste directo desde el navegador con Rava (Home + Índices) y BondTerminal
      const fuentesWeb = [
        "https://www.rava.com/?_t=" + ts,
        "https://www.rava.com/cotizaciones/indices?_t=" + ts,
        "https://bondterminal.com/?_t=" + ts
      ];
      for (const targetUrl of fuentesWeb) {
        if (!isNaN(rpUlt) && !isNaN(mArsUlt) && !isNaN(mUsdUlt)) break;
        for (const pUrl of [
          "https://corsproxy.io/?" + encodeURIComponent(targetUrl),
          "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl)
        ]) {
          try {
            const r = await fetch(pUrl, { cache: "no-store" });
            if (!r.ok) continue;
            const rawTxt = await r.text();
            const htmlU = rawTxt.replace(/&quot;/g, '"').replace(/&#34;/g, '"').replace(/\\\//g, '/');

            const extraerVentana = (regexSim, minV, maxV) => {
              let m;
              while ((m = regexSim.exec(htmlU)) !== null) {
                const vent = htmlU.slice(Math.max(0, m.index - 220), Math.min(htmlU.length, m.index + 520));
                const mU = vent.match(/"(?:ultimo|px_last|close|valor|cierre)"\s*:\s*"?([+\-]?[\d\.,]+)"?/i);
                if (mU) {
                  const u = parseNumSeguro(mU[1]);
                  if (!isNaN(u) && u >= minV && u <= maxV) {
                    const mD = vent.match(/"(?:variacion|var_dia|dia|change|porc)"\s*:\s*"?([+\-−]?[\d\.,]+)"?/i);
                    const mM = vent.match(/"(?:var_mes|mes|mensual|var_mtd)"\s*:\s*"?([+\-−]?[\d\.,]+)"?/i);
                    const mA = vent.match(/"(?:var_anio|anio|anual|var_ytd|ytd)"\s*:\s*"?([+\-−]?[\d\.,]+)"?/i);
                    return {
                      u,
                      d: mD ? parseNumSeguro(mD[1]) : NaN,
                      m: mM ? parseNumSeguro(mM[1]) : NaN,
                      a: mA ? parseNumSeguro(mA[1]) : NaN
                    };
                  }
                }
              }
              return null;
            };

            if (isNaN(rpUlt)) {
              const rRp = extraerVentana(/"(?:simbolo|especie|nombre|titulo)"\s*:\s*"RIESGO\s*PA[IÍ]S"/ig, 100, 5000);
              if (rRp) { rpUlt = rRp.u; rpDia = rRp.d; rpMes = rRp.m; rpAnio = rRp.a; }
            }
            if (isNaN(mArsUlt)) {
              const rMa = extraerVentana(/"(?:simbolo|especie|nombre|titulo)"\s*:\s*"(?:MERVAL|S&P\s*MERVAL|IMV)"/ig, 100000, 20000000);
              if (rMa) { mArsUlt = rMa.u; mArsDia = rMa.d; mArsMes = rMa.m; mArsAnio = rMa.a; }
            }
            if (isNaN(mUsdUlt)) {
              const rMu = extraerVentana(/"(?:simbolo|especie|nombre|titulo)"\s*:\s*"MERVAL\s*(?:USD|CCL)"/ig, 100, 10000);
              if (rMu) { mUsdUlt = rMu.u; mUsdDia = rMu.d; mUsdMes = rMu.m; mUsdAnio = rMu.a; }
            }

            const plano = htmlU.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
            if (isNaN(rpUlt)) {
              const mTxt = plano.match(/(?:RIESGO\s+PA[IÍ]S|EMBI\+?)\D{0,35}?([1-9](?:\.\d{3}|\d{2,3})(?:,\d{1,2})?)/i);
              if (mTxt) {
                const u = parseNumSeguro(mTxt[1]);
                if (!isNaN(u) && u >= 100 && u <= 5000) rpUlt = u;
              }
            }
            if (isNaN(mArsUlt)) {
              const mTabA = plano.match(/(?:S&P\s+)?MERVAL(?!\s*(?:USD|CCL))\s+([\d]{1,3}(?:\.[\d]{3})+(?:,[\d]+)?)\s+([+\-−]?[\d]+,[\d]+)(?:\s+([+\-−]?[\d]+,[\d]+))?(?:\s+([+\-−]?[\d]+,[\d]+))?/i);
              if (mTabA) {
                const u = parseNumSeguro(mTabA[1]);
                if (!isNaN(u) && u >= 100000) {
                  mArsUlt = u;
                  mArsDia = parseNumSeguro(mTabA[2]);
                  if (mTabA[3]) mArsMes = parseNumSeguro(mTabA[3]);
                  if (mTabA[4]) mArsAnio = parseNumSeguro(mTabA[4]);
                }
              }
            }
            if (isNaN(mUsdUlt)) {
              const mTabU = plano.match(/MERVAL\s+(?:USD|CCL)\s+([\d]{1,2}\.[\d]{3}(?:,[\d]+)?|[\d]{3,4}(?:,[\d]+)?)\s+([+\-−]?[\d]+,[\d]+)(?:\s+([+\-−]?[\d]+,[\d]+))?(?:\s+([+\-−]?[\d]+,[\d]+))?/i);
              if (mTabU) {
                const u = parseNumSeguro(mTabU[1]);
                if (!isNaN(u) && u >= 100) {
                  mUsdUlt = u;
                  mUsdDia = parseNumSeguro(mTabU[2]);
                  if (mTabU[3]) mUsdMes = parseNumSeguro(mTabU[3]);
                  if (mTabU[4]) mUsdAnio = parseNumSeguro(mTabU[4]);
                }
              }
            }
            break;
          } catch (e) {}
        }
      }

      if (!datosGlobales.indices) datosGlobales.indices = [...window.INDICES_ESTATICOS_BASE];
      const fmtPct = (v, defStr) => isNaN(v) ? defStr : (v > 0 ? "+" + v.toFixed(1).replace(".", ",") + "%" : v.toFixed(1).replace(".", ",") + "%");
      let huboCambios = false;

      const aplicarIndice = (cod, desc, ultVal, dVal, mVal, aVal, fmtStr, invertirColor) => {
        if (isNaN(ultVal)) return;
        const idx = datosGlobales.indices.findIndex(x => x && x.variable === cod);
        const prevItem = idx >= 0 ? datosGlobales.indices[idx] : {};
        const varD = fmtPct(dVal, prevItem.variacion || "0,0%");
        const varM = fmtPct(mVal, prevItem.var_mes || "0,0%");
        const varA = fmtPct(aVal, prevItem.var_anio || "0,0%");

        if (PRECIOS_ANTERIORES[cod] !== undefined && Math.abs(ultVal - PRECIOS_ANTERIORES[cod]) >= 0.5) {
          const subio = ultVal > PRECIOS_ANTERIORES[cod];
          FLASH_REGISTRO[cod] = invertirColor ? (subio ? "flash-red" : "flash-green") : (subio ? "flash-green" : "flash-red");
          setTimeout(() => { FLASH_REGISTRO[cod] = ""; }, 1400);
        }
        PRECIOS_ANTERIORES[cod] = ultVal;

        const nuevoObj = {
          variable: cod,
          descripcion: desc,
          categoria: "indices",
          subcategoria: "argentina",
          valor_formateado: fmtStr,
          variacion: varD,
          var_mes: varM,
          var_anio: varA,
          valor: ultVal,
          fecha: "Mes: " + varM + " | Año: " + varA
        };
        if (idx >= 0) datosGlobales.indices[idx] = nuevoObj;
        else datosGlobales.indices.push(nuevoObj);
        huboCambios = true;
      };

      if (!isNaN(rpUlt) && rpUlt >= 100 && rpUlt <= 5000) {
        window._RP_RAVA_BROWSER_TS = Date.now();
        aplicarIndice("RIESGO_PAIS", "Riesgo País EMBI+", rpUlt, rpDia, rpMes, rpAnio, Math.round(rpUlt).toLocaleString("es-AR") + " pb", true);
      }

      if (!isNaN(mArsUlt) && mArsUlt >= 100000) {
        aplicarIndice("MERVAL_ARS", "Merval", mArsUlt, mArsDia, mArsMes, mArsAnio, Math.round(mArsUlt).toLocaleString("es-AR") + " pts", false);
        if (isNaN(mUsdUlt)) {
          const cclPx = (window.PUNTAS_DOLAR_VIVO && window.PUNTAS_DOLAR_VIVO.DOLAR_CCL && window.PUNTAS_DOLAR_VIVO.DOLAR_CCL.venta) || 1749.47;
          if (cclPx > 800) mUsdUlt = Math.round(mArsUlt / cclPx);
        }
      }

      if (!isNaN(mUsdUlt) && mUsdUlt >= 100) {
        aplicarIndice("MERVAL_USD", "Merval USD", mUsdUlt, mUsdDia, mUsdMes, mUsdAnio, "US$ " + Math.round(mUsdUlt).toLocaleString("es-AR"), false);
      }

      if (huboCambios && (categoriaActiva === "home" || (categoriaActiva === "indices" && subIndiceActivo === "argentina"))) {
        renderizar(false);
      }
    };

    function ejecutarCicloVivo() {
      if (document.hidden) return;
      ejecutarSinSolapar("core", cargarDatos);
      ejecutarSinSolapar("cripto", actualizarCriptosEnVivo);
      ejecutarSinSolapar("dolar", actualizarPuntasDolarEnVivo);
    ejecutarSinSolapar("rp_rava", window.sincronizarRiesgoPaisRava);
      ejecutarSinSolapar("rp_rava", window.sincronizarRiesgoPaisRava);
      if (["cotizacion_bonos", "inflacion_y_ajuste", "dolar_y_cambiario", "indices"].includes(categoriaActiva)) {
        ejecutarSinSolapar("sec", sincronizarEndpointsSecundarios);
      }
      if (categoriaActiva === "tasas_y_monetario") {
        ejecutarSinSolapar("cauciones", window.sincronizarCaucionesRava);
      }
      if (categoriaActiva === "monedas") {
        ejecutarSinSolapar("monedas", window.sincronizarMonedasEnVivo);
      }
      if (categoriaActiva === "indices" && subIndiceActivo === "acciones_argentinas") {
        ejecutarSinSolapar("acciones", window.sincronizarAccionesArgentinaRava);
      }
    }

    // Carga inicial completa
    cargarDatos().then(() => renderizar(false));
    ejecutarSinSolapar("cripto", actualizarCriptosEnVivo);
    ejecutarSinSolapar("dolar", actualizarPuntasDolarEnVivo);
    ejecutarSinSolapar("sec", sincronizarEndpointsSecundarios);
    ejecutarSinSolapar("monedas", window.sincronizarMonedasEnVivo);
    ejecutarSinSolapar("cauciones", window.sincronizarCaucionesRava);
    ejecutarSinSolapar("acciones", window.sincronizarAccionesArgentinaRava);
    ejecutarSinSolapar("cal_eco", window.sincronizarCalendarioEconomico);
    ejecutarSinSolapar("licit", window.sincronizarLicitacionesA3);

    // Pulso principal cada 8s (datos en vivo) y calendarios cada 45s si están activos
    setInterval(ejecutarCicloVivo, 8000);
    setInterval(() => {
      if (document.hidden) return;
      if (categoriaActiva === "calendario_economico") ejecutarSinSolapar("cal_eco", window.sincronizarCalendarioEconomico);
      if (categoriaActiva === "calendario_licitaciones") ejecutarSinSolapar("licit", window.sincronizarLicitacionesA3);
    }, 45000);

    // Refresco instantáneo al volver a la pestaña en PC o desbloquear el teléfono
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) ejecutarCicloVivo();
    });
  </script>
</body>
