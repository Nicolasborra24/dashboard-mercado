    tailwind.config = {
      darkMode: "class",

        extend: {
          colors: {
            brand: {
              900: "#0b0f19",

<body class="text-slate-100 font-sans antialiased min-h-screen">

  <!-- Header -->

    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-black text-base">
        <i class="fa-solid fa-chart-line"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base font-bold tracking-tight text-white leading-tight">Dashboard Mercado & Macro</h1>
          <span class="text-[9px] uppercase font-bold px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300 border border-blue-500/30">v3.0 - Curvas</span>
        </div>
        <p class="text-[11px] text-slate-400">Datos oficiales BCRA, INDEC y Mercados</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="sync-status" class="flex items-center gap-1.5 text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Sincronizado
      </span>
      <span id="last-update" class="text-[11px] text-slate-400 font-mono">--:--:--</span>
    </div>
  </header>

    <div class="border-b border-slate-800/80 pb-3">

    function valorParaOrdenar(item, col) {
      const val = item[col];
      if (val === undefined || val === null || val === "-") return -999999;
      if (typeof val === "number") return val;
      const s = String(val).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
        return new Date(s).getTime();
      }
      const numMatch = s.replace(",", ".").match(/-?\d+(\.\d+)?/);
      if (numMatch) {
        return parseFloat(numMatch[0]);
      }
      return s.toLowerCase();
    }

    function ordenarTabla(tablaKey, colKey) {
      const st = SORT_STATE[tablaKey];
      if (st.col === colKey) {
        st.asc = !st.asc;
      } else {
        st.col = colKey;
        st.asc = true;
      }
      TABLAS_BONOS[tablaKey].sort((a, b) => {
        const va = valorParaOrdenar(a, colKey);
        const vb = valorParaOrdenar(b, colKey);
        if (typeof va === "string" && typeof vb === "string") {
          return st.asc ? va.localeCompare(vb) : vb.localeCompare(va);
        }
        return st.asc ? (va - vb) : (vb - va);
      });
      renderizar();
    }

      return `

      contenedor.innerHTML = `
        <section class="space-y-3">
          <div class="flex items-center gap-2 text-slate-300 font-semibold text-xs border-b border-slate-800/60 pb-1.5">
            <i class="fa-solid ${info.icono} text-blue-400"></i>
            <h2>${info.titulo}</h2>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
            ${items.map(item => crearTarjeta(item, categoriaActiva, valorOficial)).join("")}
          </div>
        </section>
      `;
    }

    function crearTarjeta(item, categoria, valorOficial) {
      if (!item) return "";

      let varColor = "text-slate-400 bg-slate-800/40 border-slate-700/50";
      let varIcon = "";
      const variacion = String(item.variacion || "").replace(/Â/g, "").trim();
      if (variacion.includes("+")) {
        varColor = "text-emerald-400 bg-emerald-500/10 border-emerald-500/20";
        varIcon = '<i class="fa-solid fa-arrow-up text-[10px] mr-1"></i>';
      } else if (variacion.includes("-") || variacion.includes("−")) {
        varColor = "text-rose-400 bg-rose-500/10 border-rose-500/20";
        varIcon = '<i class="fa-solid fa-arrow-down text-[10px] mr-1"></i>';
      }

      let badgeBrecha = "";
      if (categoria === "dolar_y_cambiario" || item.categoria === "dolar_y_cambiario") {
        if (item.variable === "DOLAR_OFICIAL") {
          badgeBrecha = '<span class="text-[9px] uppercase font-semibold text-blue-400 bg-blue-500/10 border border-blue-500/20 px-1.5 py-0.5 rounded">Ref</span>';
        } else if (valorOficial && item.valor > 0) {
          const spread = ((item.valor / valorOficial) - 1) * 100;
          const signo = spread >= 0 ? "+" : "";
          const colorSpread = spread >= 0 ? "text-amber-400 bg-amber-500/10 border-amber-500/20" : "text-sky-400 bg-sky-500/10 border-sky-500/20";
          badgeBrecha = `<span class="text-[10px] font-mono font-medium px-1.5 py-0.5 rounded border ${colorSpread}">Brecha: ${signo}${spread.toFixed(1)}%</span>`;
        }
      }

      let desc = String(item.descripcion || "").replace(/Â/g, "").trim();
      let valFmt = String(item.valor_formateado || item.valor || "-").replace(/Â/g, "").trim();
      const fecha = String(item.fecha || "").replace(/Â/g, "").trim();

      if (item.variable === "INFLACION_MENSUAL" && fecha) {
        desc = `Inflación Mensual (${fecha})`;
        if (!valFmt.includes("(")) {
          valFmt = `${valFmt} (${fecha})`;
        }
      }

      if (item.variable && item.variable.startsWith("TASA_")) {
        if (!valFmt.toUpperCase().includes("TNA")) {
          valFmt = `${valFmt} TNA`;
        }
      }

      const variablesPesos = [
        "RESULTADO_FISCAL", "RECAUDACION_TRIBUTARIA", "SALARIO_MINIMO",
        "JUBILACION_MINIMA", "CANASTA_BASICA_TOTAL", "CANASTA_BASICA_ALIMENTARIA"
      ];
      if (variablesPesos.includes(item.variable)) {
        if (!valFmt.startsWith("$")) {
          valFmt = `$${valFmt}`;
        }
      }

      if (item.variable === "RIESGO_PAIS") {
        if (!valFmt.toLowerCase().includes("puntos")) {
          valFmt = `${valFmt} pb`;
        }
      }

      return `
        <div class="bg-brand-card border border-slate-800 rounded-lg p-3 card-glow flex flex-col justify-between hover:border-slate-700 transition">
          <div>
            <div class="flex items-center justify-between gap-1.5">
              <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wider truncate" title="${desc}">${desc}</span>
              ${badgeBrecha}
            </div>
            <div class="mt-1.5 flex items-baseline justify-between gap-2">
              <span class="text-xl font-bold tracking-tight text-white font-mono truncate">${valFmt}</span>
            </div>
          </div>
          <div class="mt-2.5 pt-2 border-t border-slate-800/80 flex items-center justify-between text-[11px]">
            <span class="px-1.5 py-0.5 rounded border font-mono text-[10px] ${varColor}">
              ${varIcon}${variacion || "0,0%"}
            </span>
            <span class="text-slate-500 text-[10px] font-mono">${fecha}</span>
          </div>
        </div>
      `;
    }

    function filtrarCategoria(cat, ev) {
      categoriaActiva = cat;
      document.querySelectorAll(".nav-tab").forEach(b => {
        if (b.innerText.trim().toUpperCase() === "HOME") {
          b.className = "nav-tab px-5 rounded-xl bg-slate-800/80 text-slate-400 hover:text-white font-bold text-xs transition flex flex-col justify-center items-center gap-1 shrink-0 border border-slate-700/50";
        } else {
          b.className = "nav-tab px-2 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/80 border border-slate-800/60 transition truncate flex items-center justify-center gap-1.5";
        }
      });

      if (ev && ev.currentTarget) {
        if (cat === "home") {
          ev.currentTarget.className = "nav-tab active px-5 rounded-xl bg-blue-600 text-white font-bold text-xs transition flex flex-col justify-center items-center gap-1 shadow-lg shadow-blue-900/30 shrink-0";
        } else {
          ev.currentTarget.className = "nav-tab active px-2 py-1.5 rounded-lg bg-blue-600 text-white border border-blue-500 font-medium transition truncate flex items-center justify-center gap-1.5 shadow-md shadow-blue-900/20";
        }
      }
      renderizar();
    }

    cargarDatos();
    setInterval(cargarDatos, 60000);
  </script>
</body>
</html>
