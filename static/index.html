    // Estado de ordenamiento independiente por cada tabla
    const SORT_STATE = {
      soberanos: { col: null, asc: true },
      bopreales: { col: null, asc: true },
      lecaps: { col: null, asc: true },
      cer: { col: null, asc: true }
    };

    let datosGlobales = {};
    let categoriaActiva = "home";

    async function cargarDatos() {
      try {
        const res = await fetch("/bcra/variables?formato=agrupado");
        if (!res.ok) throw new Error("Error HTTP " + res.status);
        datosGlobales = await res.json();
        
        // Actualizar precios en vivo si vienen del backend
        if (datosGlobales.cotizacion_bonos && Array.isArray(datosGlobales.cotizacion_bonos)) {
          datosGlobales.cotizacion_bonos.forEach(b => {
            const tk = b.variable.replace("BONO_", "");
            for (const key in TABLAS_BONOS) {
              const it = TABLAS_BONOS[key].find(s => s.ticker === tk);
              if (it && b.valor > 0) it.precio = b.valor;
            }
          });
        }

        renderizar();
        const reloj = document.getElementById("last-update");
        if (reloj) reloj.innerText = new Date().toLocaleTimeString();
        const status = document.getElementById("sync-status");
        if (status) {
          status.className = "flex items-center gap-1.5 text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
          status.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Sincronizado';
        }
      } catch (err) {
        console.error("Error al cargar:", err);
        const status = document.getElementById("sync-status");
        if (status) {
          status.className = "flex items-center gap-1.5 text-[11px] font-medium px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20";
          status.innerHTML = "Error de sincronización";
        }
      }
    }

    // Función universal de normalización numérica para ordenar
    function valorParaOrdenar(item, col) {
      const val = item[col];
      if (val === undefined || val === null) return 0;
      if (typeof val === "number") return val;
      const s = String(val).trim();
      // Formato fecha YYYY-MM-DD
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
        return new Date(s).getTime();
      }
      // Extraer valor numérico de cadenas con porcentajes o prefijos
      const numMatch = s.replace(",", ".").match(/-?\d+(\.\d+)?/);
      if (numMatch) {
        return parseFloat(numMatch[0]);
      }
      return s.toLowerCase();
    }

    // Función para alternar el orden ascendente/descendente
    function ordenarTabla(tablaKey, colKey) {
      const st = SORT_STATE[tablaKey];
      if (st.col === colKey) {
        st.asc = !st.asc;
      } else {
        st.col = colKey;
        st.asc = true;
      }
      TABLAS_BONOS[tablaKey].sort((a, b) => {
        const va = valorParaOrdenar(a, colKey);
        const vb = valorParaOrdenar(b, colKey);
        if (typeof va === "string" && typeof vb === "string") {
          return st.asc ? va.localeCompare(vb) : vb.localeCompare(va);
        }
        return st.asc ? (va - vb) : (vb - va);
      });
      renderizar();
    }

    // Generador de cabeceras clickeables con icono de orden
    function renderTh(tablaKey, colKey, label, align = "text-center") {
      const st = SORT_STATE[tablaKey];
      let sortIcon = '<i class="fa-solid fa-sort text-slate-600 text-[10px] opacity-40 ml-1"></i>';
      if (st.col === colKey) {
        sortIcon = st.asc 
          ? '<i class="fa-solid fa-arrow-up text-cyan-400 text-[10px] ml-1 font-bold"></i>' 
          : '<i class="fa-solid fa-arrow-down text-cyan-400 text-[10px] ml-1 font-bold"></i>';
      }
      return `
        <th onclick="ordenarTabla('${tablaKey}', '${colKey}')" class="py-3 px-4 ${align} cursor-pointer select-none hover:text-white hover:bg-slate-800/60 transition group" title="Ordenar por ${label}">
          <div class="inline-flex items-center gap-1 ${align === 'text-right' ? 'justify-end' : align === 'text-left' ? 'justify-start' : 'justify-center'}">
            <span class="group-hover:text-cyan-300 transition">${label}</span>
            ${sortIcon}
          </div>
        </th>
      `;
    }

            <section class="space-y-3">
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">

                </div>
                <span class="text-[11px] font-mono text-slate-400">Precios en ARS / Rendimiento TIR Anual • Clic en columna para ordenar</span>
              </div>
              <div class="overflow-x-auto rounded-xl border border-slate-800 bg-brand-card shadow-2xl">
                <table class="w-full text-left text-xs font-mono">
                  <thead class="bg-slate-900/90 text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-800">
                    <tr>
                      ${renderTh("soberanos", "ticker", "TICKER", "text-left")}
                      ${renderTh("soberanos", "precio", "ÚLTIMO PRECIO", "text-right")}
                      ${renderTh("soberanos", "var", "VAR. DIARIA", "text-center")}
                      ${renderTh("soberanos", "tir", "TIR", "text-center")}
                      ${renderTh("soberanos", "duration", "MOD. DURATION", "text-center")}
                      ${renderTh("soberanos", "paridad", "PARIDAD", "text-center")}
                      ${renderTh("soberanos", "cupon", "CUPÓN", "text-center")}
                      ${renderTh("soberanos", "vto", "VENCIMIENTO", "text-center")}
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 text-slate-200">
                    ${TABLAS_BONOS.soberanos.map(b => renderFilaBono(b, true)).join("")}
                  </tbody>
                </table>
              </div>
            </section>

            <!-- Cuadro 2: Bopreales BCRA -->
            <section class="space-y-3">
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <div class="flex items-center gap-2">
                  <i class="fa-solid fa-shield-halved text-emerald-400 text-sm"></i>
                  <h2 class="text-sm font-bold text-white uppercase tracking-wider">Curva Bopreales BCRA (Series 1, 2 y 3)</h2>
                </div>
                <span class="text-[11px] font-mono text-slate-400">Precios en USD Cable / Rendimiento TIR Anual • Clic en columna para ordenar</span>
              </div>
              <div class="overflow-x-auto rounded-xl border border-slate-800 bg-brand-card shadow-2xl">
                <table class="w-full text-left text-xs font-mono">
                  <thead class="bg-slate-900/90 text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-800">
                    <tr>
                      ${renderTh("bopreales", "ticker", "TICKER", "text-left")}
                      ${renderTh("bopreales", "precio", "ÚLTIMO PRECIO", "text-right")}
                      ${renderTh("bopreales", "var", "VAR. DIARIA", "text-center")}
                      ${renderTh("bopreales", "tir", "TIR", "text-center")}
                      ${renderTh("bopreales", "duration", "MOD. DURATION", "text-center")}
                      ${renderTh("bopreales", "paridad", "PARIDAD", "text-center")}
                      ${renderTh("bopreales", "cupon", "CUPÓN", "text-center")}
                      ${renderTh("bopreales", "vto", "VENCIMIENTO", "text-center")}
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 text-slate-200">
                    ${TABLAS_BONOS.bopreales.map(b => renderFilaBono(b, false)).join("")}
                  </tbody>
                </table>
              </div>
            </section>

            <!-- Cuadro 3: Lecaps y Boncaps (Tasa Fija en Pesos) -->
            <section class="space-y-3">
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <div class="flex items-center gap-2">
                  <i class="fa-solid fa-money-bill-trend-up text-amber-400 text-sm"></i>
                  <h2 class="text-sm font-bold text-white uppercase tracking-wider">Curva Lecaps y Boncaps (Tasa Fija en Pesos)</h2>
                </div>
                <span class="text-[11px] font-mono text-slate-400">Precios por 100 VN / Rendimiento TEM y TEA • Clic en columna para ordenar</span>
              </div>
              <div class="overflow-x-auto rounded-xl border border-slate-800 bg-brand-card shadow-2xl">
                <table class="w-full text-left text-xs font-mono">
                  <thead class="bg-slate-900/90 text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-800">
                    <tr>
                      ${renderTh("lecaps", "ticker", "TICKER", "text-left")}
                      ${renderTh("lecaps", "precio", "ÚLTIMO PRECIO", "text-right")}
                      ${renderTh("lecaps", "var", "VAR. DIARIA", "text-center")}
                      ${renderTh("lecaps", "tir", "TIR / TEM", "text-center")}
                      ${renderTh("lecaps", "duration", "MOD. DURATION", "text-center")}
                      ${renderTh("lecaps", "paridad", "PARIDAD", "text-center")}
                      ${renderTh("lecaps", "cupon", "CUPÓN", "text-center")}
                      ${renderTh("lecaps", "vto", "VENCIMIENTO", "text-center")}
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 text-slate-200">
                    ${TABLAS_BONOS.lecaps.map(b => renderFilaBono(b, true)).join("")}
                  </tbody>
                </table>
              </div>
            </section>

            <!-- Cuadro 4: Bonos Soberanos CER (Ajustables por Inflación) -->
            <section class="space-y-3">
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <div class="flex items-center gap-2">
                  <i class="fa-solid fa-arrow-trend-up text-purple-400 text-sm"></i>
                  <h2 class="text-sm font-bold text-white uppercase tracking-wider">Curva Bonos Soberanos CER (Ajustables por Inflación)</h2>
                </div>
                <span class="text-[11px] font-mono text-slate-400">Precios en ARS / Rendimiento Real Anual sobre CER • Clic en columna para ordenar</span>
              </div>
              <div class="overflow-x-auto rounded-xl border border-slate-800 bg-brand-card shadow-2xl">
                <table class="w-full text-left text-xs font-mono">
                  <thead class="bg-slate-900/90 text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-800">
                    <tr>
                      ${renderTh("cer", "ticker", "TICKER", "text-left")}
                      ${renderTh("cer", "precio", "ÚLTIMO PRECIO", "text-right")}
                      ${renderTh("cer", "var", "VAR. DIARIA", "text-center")}
                      ${renderTh("cer", "tir", "TIR REAL", "text-center")}
                      ${renderTh("cer", "duration", "MOD. DURATION", "text-center")}
                      ${renderTh("cer", "paridad", "PARIDAD", "text-center")}
                      ${renderTh("cer", "cupon", "CUPÓN", "text-center")}
                      ${renderTh("cer", "vto", "VENCIMIENTO", "text-center")}
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60 text-slate-200">
                    ${TABLAS_BONOS.cer.map(b => renderFilaBono(b, true)).join("")}
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        `;
        return;
      }

      // VISTA HOME: Resumen de mercado
      if (categoriaActiva === "home") {
        let todos = [];
        for (const cat in datosGlobales) {
          if (Array.isArray(datosGlobales[cat])) {
            todos = todos.concat(datosGlobales[cat]);
          }
        }

        const itemsHome = [];
        for (const cod of VARIABLES_HOME) {
          const item = todos.find(i => {
            if (!i) return false;
            if (i.variable === cod) return true;
            if (cod === "METALES_XAU" && (i.variable === "METALES_ORO" || i.variable === "METALES_XAU")) return true;
            if (cod === "METALES_XAG" && (i.variable === "METALES_PLATA" || i.variable === "METALES_XAG")) return true;
            if (cod === "METALES_HG00" && (i.variable === "METALES_COBRE" || i.variable === "METALES_HG00")) return true;
            return false;
          });
          if (item && !itemsHome.some(it => it.variable === item.variable)) {
            itemsHome.push(item);
          }
        }

        const info = NOMBRES_SECCIONES.home;
        contenedor.innerHTML = `
          <section class="space-y-3">
            <div class="flex items-center gap-2 text-slate-300 font-semibold text-xs border-b border-slate-800/60 pb-1.5">
              <i class="fa-solid ${info.icono} text-blue-400"></i>
              <h2>${info.titulo}</h2>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
              ${itemsHome.map(item => crearTarjeta(item, item.categoria, valorOficial)).join("")}
            </div>
          </section>
        `;
        return;
      }

      // RESTO DE LAS CATEGORÍAS (Tarjetas estándar)
      const items = (datosGlobales[categoriaActiva] || []).filter(i => i && i.variable !== "BRECHA_CAMBIARIA");
      const info = NOMBRES_SECCIONES[categoriaActiva] || { titulo: categoriaActiva, icono: "fa-circle-dot" };

      if (items.length === 0) {
        contenedor.innerHTML = '<div class="py-16 text-center text-slate-500 text-xs">No hay datos disponibles en esta sección.</div>';
        return;
      }

      contenedor.innerHTML = `
        <section class="space-y-3">
          <div class="flex items-center gap-2 text-slate-300 font-semibold text-xs border-b border-slate-800/60 pb-1.5">
            <i class="fa-solid ${info.icono} text-blue-400"></i>
            <h2>${info.titulo}</h2>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
            ${items.map(item => crearTarjeta(item, categoriaActiva, valorOficial)).join("")}
          </div>
        </section>
      `;
    }

    function renderFilaBono(b, esPesos) {
      const varNum = parseFloat(String(b.var).replace("%", "").replace("+", ""));
      const varBoxClass = varNum > 1.0 
        ? "bg-emerald-950/60 text-emerald-300 border border-emerald-800/40"
        : "bg-amber-950/40 text-amber-300 border border-amber-800/40";

      const cuponNum = parseFloat(String(b.cupon).replace("%", ""));
      const cuponBoxClass = (!isNaN(cuponNum) && cuponNum >= 3.0)
        ? "bg-emerald-950/60 text-emerald-300 border border-emerald-800/40"
        : "bg-amber-950/40 text-amber-300 border border-amber-800/40";

      const precioFmt = esPesos 
        ? `$ ${Number(b.precio).toLocaleString("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` 
        : `US$ ${Number(b.precio).toFixed(2)}`;

      return `
        <tr class="table-dark-row transition">
          <td class="py-2.5 px-4 font-bold text-white tracking-wide">${b.ticker}</td>
          <td class="py-2.5 px-4 text-right font-medium text-slate-200">${precioFmt}</td>
          <td class="py-2.5 px-4 text-center">
            <span class="inline-block w-20 py-1 rounded font-semibold ${varBoxClass}">
              ${b.var}
            </span>
          </td>
          <td class="py-2.5 px-4 text-center">
            <span class="inline-block px-2.5 py-1 rounded border border-emerald-700/50 bg-emerald-950/60 font-bold text-emerald-300">
              ${b.tir}
            </span>
          </td>
          <td class="py-2.5 px-4 text-center text-slate-300">${b.duration}</td>
          <td class="py-2.5 px-4 text-center text-slate-300">${b.paridad}</td>
          <td class="py-2.5 px-4 text-center">
            <span class="inline-block px-2.5 py-0.5 rounded font-medium ${cuponBoxClass}">
              ${b.cupon}
            </span>
          </td>
          <td class="py-2.5 px-4 text-center text-slate-400">${b.vto}</td>
        </tr>
      `;
    }

    function crearTarjeta(item, categoria, valorOficial) {
      if (!item) return "";

      let varColor = "text-slate-400 bg-slate-800/40 border-slate-700/50";
      let varIcon = "";
      const variacion = String(item.variacion || "").replace(/Â/g, "").trim();
      if (variacion.includes("+")) {
        varColor = "text-emerald-400 bg-emerald-500/10 border-emerald-500/20";
        varIcon = '<i class="fa-solid fa-arrow-up text-[10px] mr-1"></i>';
      } else if (variacion.includes("-") || variacion.includes("−")) {
        varColor = "text-rose-400 bg-rose-500/10 border-rose-500/20";
        varIcon = '<i class="fa-solid fa-arrow-down text-[10px] mr-1"></i>';
      }

      let badgeBrecha = "";
      if (categoria === "dolar_y_cambiario" || item.categoria === "dolar_y_cambiario") {
        if (item.variable === "DOLAR_OFICIAL") {
          badgeBrecha = '<span class="text-[9px] uppercase font-semibold text-blue-400 bg-blue-500/10 border border-blue-500/20 px-1.5 py-0.5 rounded">Ref</span>';
        } else if (valorOficial && item.valor > 0) {
          const spread = ((item.valor / valorOficial) - 1) * 100;
          const signo = spread >= 0 ? "+" : "";
          const colorSpread = spread >= 0 ? "text-amber-400 bg-amber-500/10 border-amber-500/20" : "text-sky-400 bg-sky-500/10 border-sky-500/20";
          badgeBrecha = `<span class="text-[10px] font-mono font-medium px-1.5 py-0.5 rounded border ${colorSpread}">Brecha: ${signo}${spread.toFixed(1)}%</span>`;
        }
      }

      let desc = String(item.descripcion || "").replace(/Â/g, "").trim();
      let valFmt = String(item.valor_formateado || item.valor || "-").replace(/Â/g, "").trim();
      const fecha = String(item.fecha || "").replace(/Â/g, "").trim();

      if (item.variable === "INFLACION_MENSUAL" && fecha) {
        desc = `Inflación Mensual (${fecha})`;
        if (!valFmt.includes("(")) {
          valFmt = `${valFmt} (${fecha})`;
        }
      }

      if (item.variable && item.variable.startsWith("TASA_")) {
        if (!valFmt.toUpperCase().includes("TNA")) {
          valFmt = `${valFmt} TNA`;
        }
      }

      const variablesPesos = [
        "RESULTADO_FISCAL", "RECAUDACION_TRIBUTARIA", "SALARIO_MINIMO",
        "JUBILACION_MINIMA", "CANASTA_BASICA_TOTAL", "CANASTA_BASICA_ALIMENTARIA"
      ];
      if (variablesPesos.includes(item.variable)) {
        if (!valFmt.startsWith("$")) {
          valFmt = `$${valFmt}`;
        }
      }

      if (item.variable === "RIESGO_PAIS") {
        if (!valFmt.toLowerCase().includes("puntos")) {
          valFmt = `${valFmt} pb`;
        }
      }

      return `
        <div class="bg-brand-card border border-slate-800 rounded-lg p-3 card-glow flex flex-col justify-between hover:border-slate-700 transition">
          <div>
            <div class="flex items-center justify-between gap-1.5">
              <span class="text-[11px] font-medium text-slate-400 uppercase tracking-wider truncate" title="${desc}">${desc}</span>
              ${badgeBrecha}
            </div>
            <div class="mt-1.5 flex items-baseline justify-between gap-2">
              <span class="text-xl font-bold tracking-tight text-white font-mono truncate">${valFmt}</span>
            </div>
          </div>
          <div class="mt-2.5 pt-2 border-t border-slate-800/80 flex items-center justify-between text-[11px]">
            <span class="px-1.5 py-0.5 rounded border font-mono text-[10px] ${varColor}">
              ${varIcon}${variacion || "0,0%"}
            </span>
            <span class="text-slate-500 text-[10px] font-mono">${fecha}</span>
          </div>
        </div>
      `;
    }

    function filtrarCategoria(cat, ev) {
      categoriaActiva = cat;
      document.querySelectorAll(".nav-tab").forEach(b => {
        if (b.innerText.trim().toUpperCase() === "HOME") {
          b.className = "nav-tab px-5 rounded-xl bg-slate-800/80 text-slate-400 hover:text-white font-bold text-xs transition flex flex-col justify-center items-center gap-1 shrink-0 border border-slate-700/50";
        } else {
          b.className = "nav-tab px-2 py-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/80 border border-slate-800/60 transition truncate flex items-center justify-center gap-1.5";
        }
      });

      if (ev && ev.currentTarget) {
        if (cat === "home") {
          ev.currentTarget.className = "nav-tab active px-5 rounded-xl bg-blue-600 text-white font-bold text-xs transition flex flex-col justify-center items-center gap-1 shadow-lg shadow-blue-900/30 shrink-0";
        } else {
          ev.currentTarget.className = "nav-tab active px-2 py-1.5 rounded-lg bg-blue-600 text-white border border-blue-500 font-medium transition truncate flex items-center justify-center gap-1.5 shadow-md shadow-blue-900/20";
        }
      }
      renderizar();
    }

    cargarDatos();
    setInterval(cargarDatos, 60000);
  </script>
</body>
</html>
