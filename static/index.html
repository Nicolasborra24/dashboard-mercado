<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Financiero Argentino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              900: "#0b0f19",
              800: "#111827",
              700: "#1f2937",
              card: "#131b2e"
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #080c14; }
    .card-glow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body class="text-slate-100 font-sans antialiased min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-brand-900/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-black text-xl">
        <i class="fa-solid fa-chart-line"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white">Dashboard Mercado & Macro</h1>
        <p class="text-xs text-slate-400">Datos oficiales BCRA, INDEC y Mercados</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <span id="sync-status" class="flex items-center gap-2 text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Sincronizado
      </span>
      <span id="last-update" class="text-xs text-slate-400 font-mono">--:--:--</span>
    </div>
  </header>

  <!-- Navigation / Filtros -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-8">
    <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none border-b border-slate-800/80 text-sm font-medium">
      <button onclick="filtrarCategoria('home', event)" class="nav-tab active px-4 py-2 rounded-lg bg-blue-600 text-white transition flex items-center gap-2">
        <i class="fa-solid fa-house text-xs"></i> HOME
      </button>
      <button onclick="filtrarCategoria('tasas_y_monetario', event)" class="nav-tab px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">Tasas y BCRA</button>
      <button onclick="filtrarCategoria('dolar_y_cambiario', event)" class="nav-tab px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">Dólar y Brechas</button>
      <button onclick="filtrarCategoria('monedas', event)" class="nav-tab px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition flex items-center gap-2">
        <i class="fa-solid fa-money-bill-1-wave text-xs text-emerald-400"></i> Monedas
      </button>
      <button onclick="filtrarCategoria('inflacion_y_ajuste', event)" class="nav-tab px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">Inflación, CER y UVA</button>
      <button onclick="filtrarCategoria('mercado_y_deuda', event)" class="nav-tab px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">Mercado y Renta</button>
      <button onclick="filtrarCategoria('metales', event)" class="nav-tab px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition flex items-center gap-2">
        <i class="fa-solid fa-coins text-xs text-amber-400"></i> Metales
      </button>
      <button onclick="filtrarCategoria('petroleo', event)" class="nav-tab px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition flex items-center gap-2">
        <i class="fa-solid fa-oil-well text-xs text-amber-500"></i> Petróleo
      </button>
      <button onclick="filtrarCategoria('macro_y_fiscal', event)" class="nav-tab px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">Macro & Fiscal</button>
      <button onclick="filtrarCategoria('micro_y_sectores', event)" class="nav-tab px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">Micro & Actividad</button>
      <button onclick="filtrarCategoria('commodities_agro_energia', event)" class="nav-tab px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">Agro & Energía</button>
    </div>

    <!-- Contenedor General -->
    <div id="dashboard-content" class="space-y-10">
      <div class="flex justify-center items-center py-20 text-slate-500">
        <i class="fa-solid fa-spinner fa-spin text-3xl"></i>
      </div>
    </div>
  </main>

  <script>
    const NOMBRES_SECCIONES = {
      home: { titulo: "Resumen Ejecutivo de Mercado", icono: "fa-gauge-high" },
      tasas_y_monetario: { titulo: "Tasas de Interés y Balance Monetario", icono: "fa-landmark" },
      dolar_y_cambiario: { titulo: "Mercado Cambiario y Cotizaciones", icono: "fa-dollar-sign" },
      monedas: { titulo: "Divisas y Tipos de Cambio Internacionales", icono: "fa-money-bill-1-wave" },
      inflacion_y_ajuste: { titulo: "Inflación y Coeficientes de Ajuste", icono: "fa-arrow-trend-up" },
      mercado_y_deuda: { titulo: "Mercado Bursátil y Deuda Soberana", icono: "fa-money-bill-transfer" },
      metales: { titulo: "Metales Preciosos e Industriales", icono: "fa-coins" },
      petroleo: { titulo: "Mercado Internacional de Petróleo y Crudo", icono: "fa-oil-well" },
      macro_y_fiscal: { titulo: "Macroeconomía, Comercio Exterior y Fiscal", icono: "fa-scale-balanced" },
      micro_y_sectores: { titulo: "Economía Real y Crédito", icono: "fa-industry" },
      commodities_agro_energia: { titulo: "Commodities, Agro y Energía", icono: "fa-wheat-awn" }
    };

    const VARIABLES_HOME = [
      "DOLAR_OFICIAL",
      "DOLAR_MEP",
      "DOLAR_CCL",
      "INFLACION_MENSUAL",
      "RIESGO_PAIS",
      "MERVAL_ARS",
      "MERVAL_USD",
      "TASA_TAMAR",
      "TASA_BADLAR",
      "AGRO_SOJA",
      "AGRO_MAIZ",
      "METALES_XAU",
      "METALES_XAG",
      "METALES_HG00",
      "PETROLEO_WTI",
      "PETROLEO_BRENT"
    ];

    let datosGlobales = {};
    let categoriaActiva = "home";

    async function cargarDatos() {
      try {
        const res = await fetch("/bcra/variables?formato=agrupado");
        if (!res.ok) throw new Error("Error HTTP " + res.status);
        datosGlobales = await res.json();
        renderizar();
        const reloj = document.getElementById("last-update");
        if (reloj) reloj.innerText = new Date().toLocaleTimeString();
        const status = document.getElementById("sync-status");
        if (status) {
          status.className = "flex items-center gap-2 text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
          status.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Sincronizado';
        }
      } catch (err) {
        console.error("Error al cargar:", err);
        const status = document.getElementById("sync-status");
        if (status) {
          status.className = "flex items-center gap-2 text-xs font-medium px-2.5 py-1 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20";
          status.innerHTML = "Error de sincronización";
        }
      }
    }

    function renderizar() {
      const contenedor = document.getElementById("dashboard-content");
      if (!contenedor) return;

      let valorOficial = null;
      const listaDolar = datosGlobales.dolar_y_cambiario || [];
      const itemOficial = listaDolar.find(d => d && d.variable === "DOLAR_OFICIAL");
      if (itemOficial && itemOficial.valor > 0) {
        valorOficial = itemOficial.valor;
      }

      if (categoriaActiva === "home") {
        let todos = [];
        for (const cat in datosGlobales) {
          if (Array.isArray(datosGlobales[cat])) {
            todos = todos.concat(datosGlobales[cat]);
          }
        }

        const itemsHome = [];
        for (const cod of VARIABLES_HOME) {
          const item = todos.find(i => {
            if (!i) return false;
            if (i.variable === cod) return true;
            if (cod === "METALES_XAU" && (i.variable === "METALES_ORO" || i.variable === "METALES_XAU")) return true;
            if (cod === "METALES_XAG" && (i.variable === "METALES_PLATA" || i.variable === "METALES_XAG")) return true;
            if (cod === "METALES_HG00" && (i.variable === "METALES_COBRE" || i.variable === "METALES_HG00")) return true;
            return false;
          });
          if (item && !itemsHome.some(it => it.variable === item.variable)) {
            itemsHome.push(item);
          }
        }

        const info = NOMBRES_SECCIONES.home;
        contenedor.innerHTML = `
          <section class="space-y-4">
            <div class="flex items-center gap-2 text-slate-300 font-semibold text-base border-b border-slate-800/60 pb-2">
              <i class="fa-solid ${info.icono} text-blue-400"></i>
              <h2>${info.titulo}</h2>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              ${itemsHome.map(item => crearTarjeta(item, item.categoria, valorOficial)).join("")}
            </div>
          </section>
        `;
        return;
      }

      const items = (datosGlobales[categoriaActiva] || []).filter(i => i && i.variable !== "BRECHA_CAMBIARIA");
      const info = NOMBRES_SECCIONES[categoriaActiva] || { titulo: categoriaActiva, icono: "fa-circle-dot" };

      if (items.length === 0) {
        contenedor.innerHTML = '<div class="py-16 text-center text-slate-500">No hay datos disponibles en esta sección.</div>';
        return;
      }

      contenedor.innerHTML = `
        <section class="space-y-4">
          <div class="flex items-center gap-2 text-slate-300 font-semibold text-base border-b border-slate-800/60 pb-2">
            <i class="fa-solid ${info.icono} text-blue-400"></i>
            <h2>${info.titulo}</h2>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            ${items.map(item => crearTarjeta(item, categoriaActiva, valorOficial)).join("")}
          </div>
        </section>
      `;
    }

    function crearTarjeta(item, categoria, valorOficial) {
      if (!item) return "";

      let varColor = "text-slate-400 bg-slate-800/40 border-slate-700/50";
      let varIcon = "";
      const variacion = String(item.variacion || "").replace(/Â/g, "").trim();
      if (variacion.includes("+")) {
        varColor = "text-emerald-400 bg-emerald-500/10 border-emerald-500/20";
        varIcon = '<i class="fa-solid fa-arrow-up text-xs mr-1"></i>';
      } else if (variacion.includes("-") || variacion.includes("−")) {
        varColor = "text-rose-400 bg-rose-500/10 border-rose-500/20";
        varIcon = '<i class="fa-solid fa-arrow-down text-xs mr-1"></i>';
      }

      let badgeBrecha = "";
      if (categoria === "dolar_y_cambiario" || item.categoria === "dolar_y_cambiario") {
        if (item.variable === "DOLAR_OFICIAL") {
          badgeBrecha = '<span class="text-[10px] uppercase font-semibold text-blue-400 bg-blue-500/10 border border-blue-500/20 px-2 py-0.5 rounded">TC Referencia</span>';
        } else if (valorOficial && item.valor > 0) {
          const spread = ((item.valor / valorOficial) - 1) * 100;
          const signo = spread >= 0 ? "+" : "";
          const colorSpread = spread >= 0 ? "text-amber-400 bg-amber-500/10 border-amber-500/20" : "text-sky-400 bg-sky-500/10 border-sky-500/20";
          badgeBrecha = `<span class="text-[11px] font-mono font-medium px-2 py-0.5 rounded border ${colorSpread}">Brecha: ${signo}${spread.toFixed(1)}%</span>`;
        }
      }

      let desc = String(item.descripcion || "").replace(/Â/g, "").trim();
      let valFmt = String(item.valor_formateado || item.valor || "-").replace(/Â/g, "").trim();
      const fecha = String(item.fecha || "").replace(/Â/g, "").trim();

      if (item.variable === "INFLACION_MENSUAL" && fecha) {
        desc = `Inflación Mensual (${fecha})`;
        if (!valFmt.includes("(")) {
          valFmt = `${valFmt} (${fecha})`;
        }
      }

      if (item.variable && item.variable.startsWith("TASA_")) {
        if (!valFmt.toUpperCase().includes("TNA")) {
          valFmt = `${valFmt} TNA`;
        }
      }

      const variablesPesos = [
        "RESULTADO_FISCAL", "RECAUDACION_TRIBUTARIA", "SALARIO_MINIMO",
        "JUBILACION_MINIMA", "CANASTA_BASICA_TOTAL", "CANASTA_BASICA_ALIMENTARIA"
      ];
      if (variablesPesos.includes(item.variable)) {
        if (!valFmt.startsWith("$")) {
          valFmt = `$${valFmt}`;
        }
      }

      if (item.variable === "RIESGO_PAIS") {
        if (!valFmt.toLowerCase().includes("puntos")) {
          valFmt = `${valFmt} puntos básicos`;
        }
      }

      return `
        <div class="bg-brand-card border border-slate-800 rounded-xl p-4 card-glow flex flex-col justify-between hover:border-slate-700 transition">
          <div>
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs font-medium text-slate-400 uppercase tracking-wider truncate" title="${desc}">${desc}</span>
              ${badgeBrecha}
            </div>
            <div class="mt-2 flex items-baseline justify-between gap-2">
              <span class="text-2xl font-bold tracking-tight text-white font-mono">${valFmt}</span>
            </div>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs">
            <span class="px-2 py-0.5 rounded border font-mono ${varColor}">
              ${varIcon}${variacion || "0,0%"}
            </span>
            <span class="text-slate-500">${fecha}</span>
          </div>
        </div>
      `;
    }

    function filtrarCategoria(cat, ev) {
      categoriaActiva = cat;
      document.querySelectorAll(".nav-tab").forEach(b => {
        b.className = "nav-tab px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition flex items-center gap-2";
      });
      if (ev && ev.currentTarget) {
        ev.currentTarget.className = "nav-tab active px-4 py-2 rounded-lg bg-blue-600 text-white transition flex items-center gap-2";
      }
      renderizar();
    }

    cargarDatos();
    setInterval(cargarDatos, 60000);
  </script>
</body>
</html>
