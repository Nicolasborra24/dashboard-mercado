      if (val === undefined || val === null || val === "-") return NaN;
      if (typeof val === "number") return val;
      let s = String(val).replace(/[%$a-zA-Z\s]/g, "").trim();
      if (!s) return NaN;
      if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
      else if (s.includes(",")) s = s.replace(",", ".");
      const n = parseFloat(s);
      return isNaN(n) ? NaN : n;
    }

    function extraerTIRParaCurva(fila) {
      const keys = Object.keys(fila);
      const kTir = keys.find(k => /^tir$|^tea$|tir_anual|tir\s*\(%\)|tea\s*\(%\)|rendimiento/i.test(k.trim())) || keys.find(k => /tir|tea/i.test(k));
      if (kTir) {
        const v = parseNumSeguro(fila[kTir]);
        if (!isNaN(v) && v !== 0) return v;
      }
      const kTna = keys.find(k => /tna/i.test(k));
      if (kTna) {
        const vTna = parseNumSeguro(fila[kTna]);
        if (!isNaN(vTna) && vTna !== 0) return vTna;
      }
      const kTem = keys.find(k => /tem/i.test(k));
      if (kTem) {
        const vTem = parseNumSeguro(fila[kTem]);
        if (!isNaN(vTem) && vTem > 0) return +(((Math.pow(1 + vTem / 100, 12)) - 1) * 100).toFixed(2);
      }
      return NaN;
    }

    function dibujarGraficoCurva() {
      const canvas = document.getElementById("canvas-curva-bonos");
      if (!canvas) return;
      if (chartCurvaInstance) { chartCurvaInstance.destroy(); chartCurvaInstance = null; }

      const filas = obtenerFilasCurva(curvaActiva);
      const puntos = [];

      filas.forEach((f, idx) => {
        const keys = Object.keys(f);
        const kTicker = keys.find(k => /ticker|especie|bono|simbolo/i.test(k)) || keys[0];
        const kDias = keys.find(k => /^dias$|^días$|dias_vto|días_al_vencimiento|plazo/i.test(k.trim())) || keys.find(k => /dias|días/i.test(k));
        const kVto = keys.find(k => /vencimiento|vto|fecha/i.test(k));
        const kDur = keys.find(k => /^md$|duration|duracion/i.test(k));

        const ticker = String(f[kTicker] || `B${idx + 1}`).trim();
        let diasVal = kDias ? parseNumSeguro(f[kDias]) : NaN;

        if (isNaN(diasVal) && kVto && f[kVto]) {
          const sVto = String(f[kVto]).trim();
          let fVto = new Date(sVto);
          if (isNaN(fVto.getTime()) && /^\d{2}\/\d{2}\/\d{4}$/.test(sVto)) {
            const p = sVto.split("/");
            fVto = new Date(`${p[2]}-${p[1]}-${p[0]}`);
          }
          if (!isNaN(fVto.getTime())) diasVal = Math.max(1, Math.round((fVto - new Date()) / 86400000));
        }
        if (isNaN(diasVal) && kDur) {
          const dVal = parseNumSeguro(f[kDur]);
          if (!isNaN(dVal)) diasVal = Math.round(dVal * 365);
        }

        const yVal = extraerTIRParaCurva(f);
        if (!isNaN(diasVal) && !isNaN(yVal) && diasVal > 0 && yVal > -30 && yVal < 250) {
          puntos.push({ x: diasVal, y: yVal, ticker });
        }
      });

      puntos.sort((a, b) => a.x - b.x);

      const lineaTendencia = [];
      if (puntos.length >= 2) {
        const n = puntos.length;
        const xs = puntos.map(p => Math.log(Math.max(1, p.x)));
        const ys = puntos.map(p => p.y);
        const meanX = xs.reduce((a, b) => a + b, 0) / n;
        const meanY = ys.reduce((a, b) => a + b, 0) / n;
        let num = 0, den = 0;
        for (let i = 0; i < n; i++) {
          num += (xs[i] - meanX) * (ys[i] - meanY);
          den += (xs[i] - meanX) ** 2;
        }
        const b = den !== 0 ? num / den : 0;
        const a = meanY - b * meanX;
        const minX = Math.max(1, puntos[0].x);
        const maxX = puntos[puntos.length - 1].x;
        for (let i = 0; i <= 100; i++) {
          const cx = minX + ((maxX - minX) * i) / 100;
          lineaTendencia.push({ x: +cx.toFixed(2), y: +(a + b * Math.log(Math.max(1, cx))).toFixed(2) });
        }
      }

      chartCurvaInstance = new Chart(canvas.getContext("2d"), {
        type: "scatter",
        data: {
          datasets: [
            { label: "Bonos", data: puntos, backgroundColor: "#3b82f6", borderColor: "#3b82f6", borderWidth: 1, pointStyle: "circle", pointRadius: 5, pointHoverRadius: 7, order: 1 },
            { label: "Tendencia", data: lineaTendencia, type: "line", borderColor: "#ef4444", backgroundColor: "transparent", borderWidth: 2, borderDash: [3, 3], pointStyle: "line", pointRadius: 0, pointHoverRadius: 0, fill: false, tension: 0.35, order: 2 }
          ]
        },
        options: {

    window.registrarCambioPrecioDolar = function(cod, nuevoCompra, nuevoVenta, varFmt, fecStr) {
      const prevObj = window.PUNTAS_DOLAR_VIVO[cod] || {};
      const prevVenta = PRECIOS_ANTERIORES[cod] !== undefined ? PRECIOS_ANTERIORES[cod] : prevObj.venta;
      const prevCompra = prevObj.compra;

      if (prevVenta !== undefined && !isNaN(nuevoVenta)) {
        const diffV = Math.abs(Number(nuevoVenta) - Number(prevVenta));
        const diffC = (nuevoCompra && prevCompra) ? Math.abs(Number(nuevoCompra) - Number(prevCompra)) : 0;
        if (diffV >= 0.01 || diffC >= 0.01) {
          if (nuevoVenta > prevVenta || (nuevoCompra && prevCompra && nuevoCompra > prevCompra)) {
            FLASH_REGISTRO[cod] = "flash-green";
          } else {
            FLASH_REGISTRO[cod] = "flash-red";
          }
          setTimeout(() => { FLASH_REGISTRO[cod] = ""; }, 1400);
        } else {
          FLASH_REGISTRO[cod] = "";
        }
      } else {
        FLASH_REGISTRO[cod] = "";
      }

      PRECIOS_ANTERIORES[cod] = nuevoVenta;
      window.PUNTAS_DOLAR_VIVO[cod] = {
        compra: nuevoCompra,
        venta: nuevoVenta,
        variacion: varFmt || prevObj.variacion || "0,00%",

    window.parsearNodoDolaritoCliente = function(kHint, nd) {
      if (!nd || typeof nd !== "object") return;
      const nom = (kHint + " " + (nd.name || "") + " " + (nd.nombre || "") + " " + (nd.slug || "") + " " + (nd.type || "")).toLowerCase();
      if (/uala|ualá|brubank|nexo|youhodler|arq|prex/.test(nom)) return;
      const c = parseNumSeguro(nd.buy ?? nd.compra ?? nd.bid);
      const v = parseNumSeguro(nd.sell ?? nd.venta ?? nd.value ?? nd.valor ?? nd.ask);
      const vr = parseNumSeguro(nd.variation ?? nd.variacion ?? nd.change ?? nd.var);
      if (isNaN(v) || v < 900 || v > 5000) return;

      let cod = null, soloVenta = false;
      if (/mayorista|a3500|3500|mulc|wholesale/.test(nom)) cod = "DOLAR_A3500";
      else if (/oficial|minorista|bna|nacion/.test(nom) && !/mejor|tarjeta|mayorista/.test(nom)) cod = "DOLAR_OFICIAL";
      else if (/blue|informal|paralelo/.test(nom)) cod = "DOLAR_BLUE";
      else if (/mep|bolsa/.test(nom)) { cod = "DOLAR_MEP"; soloVenta = true; }
      else if (/ccl|liqui/.test(nom)) { cod = "DOLAR_CCL"; soloVenta = true; }
      else if (/cripto|crypto|usdt/.test(nom)) cod = "DOLAR_CRIPTO";
      else if (/tarjeta|turista/.test(nom)) { cod = "DOLAR_TARJETA"; soloVenta = true; }
      else if (/netflix|streaming/.test(nom)) { cod = "DOLAR_NETFLIX"; soloVenta = true; }
      else if (/futuro|rofex/.test(nom)) cod = "DOLAR_FUTURO";

      if (cod) {
        const prev = window.PUNTAS_DOLAR_VIVO[cod] || {};
        let varFmt = prev.variacion || "0,00%";
        if (!isNaN(vr)) {
          varFmt = vr > 0 ? `+${vr.toFixed(2).replace(".", ",")}%` : (vr < 0 ? `${vr.toFixed(2).replace(".", ",")}%` : "0,00%");
        }
        const cFinal = soloVenta ? null : (!isNaN(c) && c > 900 ? c : prev.compra);
        window.registrarCambioPrecioDolar(cod, cFinal, v, varFmt, new Date().toLocaleTimeString());
      }
    };

    window.extraerDolaresDesdeRavaHTML = function(htmlRaw) {

      let m;
      while ((m = regexObj.exec(htmlU)) !== null) {
        const b = m[0];
        const sim = m[1].toUpperCase();
        if (!/DOLAR|DÓLAR|MEP|CCL|MAYORISTA|CRIPTO/.test(sim)) continue;
        const mU = b.match(/"(?:ultimo|venta|valor|close)"\s*:\s*"?([+\-]?[\d\.,]+)"?/i);
        const mC = b.match(/"(?:compra|buy|bid)"\s*:\s*"?([+\-]?[\d\.,]+)"?/i);
        const mD = b.match(/"(?:variacion|var_dia|dia|change)"\s*:\s*"?([+\-−]?[\d\.,]+)"?/i);
        const vu = mU ? parseNumSeguro(mU[1]) : NaN;
        const vc = mC ? parseNumSeguro(mC[1]) : NaN;
        const vd = mD ? parseNumSeguro(mD[1]) : NaN;
        if (isNaN(vu) || vu < 900 || vu > 5000) continue;

        let cod = null, soloV = false;
        if (sim.includes("MEP") || sim.includes("BOLSA")) { cod = "DOLAR_MEP"; soloV = true; }
        else if (sim.includes("CCL") || sim.includes("LIQUI")) { cod = "DOLAR_CCL"; soloV = true; }
        else if (sim.includes("MAYORISTA") || sim.includes("A3500")) cod = "DOLAR_A3500";
        else if (sim.includes("BLUE") || sim.includes("INFORMAL")) cod = "DOLAR_BLUE";
        else if (sim.includes("OFICIAL") || sim.includes("BNA")) cod = "DOLAR_OFICIAL";
        else if (sim.includes("CRIPTO")) cod = "DOLAR_CRIPTO";

        if (cod) {
          const prev = window.PUNTAS_DOLAR_VIVO[cod] || {};
          const varStr = !isNaN(vd) ? (vd > 0 ? `+${vd.toFixed(2).replace(".", ",")}%` : `${vd.toFixed(2).replace(".", ",")}%`) : prev.variacion;
          window.registrarCambioPrecioDolar(cod, soloV ? null : (!isNaN(vc) && vc > 900 ? vc : prev.compra), vu, varStr, new Date().toLocaleTimeString());
        }
      }
    };

      const data = await fetchJsonSeguro("/bcra/variables?formato=agrupado&t=" + Date.now());

      for (const cat in data) {
        if (cat === "cripto" || !Array.isArray(data[cat]) || data[cat].length === 0) continue;
        data[cat].forEach(item => {
          if (item && item.variable && item.valor !== undefined) {
            const k = item.variable, v = parseFloat(item.valor);
            if (PRECIOS_ANTERIORES[k] !== undefined && !isNaN(v)) {
              if (Math.abs(v - PRECIOS_ANTERIORES[k]) >= 0.01) {
                FLASH_REGISTRO[k] = v > PRECIOS_ANTERIORES[k] ? "flash-green" : "flash-red";
                setTimeout(() => { FLASH_REGISTRO[k] = ""; }, 1400);
              } else {
                FLASH_REGISTRO[k] = "";
              }
            }
            PRECIOS_ANTERIORES[k] = v;
          }
        });
        datosGlobales[cat] = data[cat];
      }
      renderizar(false);
      const reloj = document.getElementById("last-update");
      if (reloj) reloj.innerText = new Date().toLocaleTimeString();

      const val = item[col];

      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s).getTime();
      const numMatch = s.replace(",", ".").match(/-?\d+(\.\d+)?/);
      return numMatch ? parseFloat(numMatch[0]) : s.toLowerCase();

        const inicio = new Date(d);
        inicio.setDate(d.getDate() + diff);
        const fin = new Date(inicio);
        fin.setDate(inicio.getDate() + 6);
        return { inicio: inicio, fin: fin };
      } else {
        const primero = new Date(d.getFullYear(), d.getMonth(), 1);
        const ultimo = new Date(d.getFullYear(), d.getMonth() + 1, 0);
        return { inicio: primero, fin: ultimo };

      let lista = window.CALENDARIO_INDEC_DATA.filter(item => {
        if (window.indecModoVista === "dia") return item.fecha === window.indecFechaSeleccionada;
        return item.fecha.startsWith(prefijoMes);

      if (window.indecBusqueda.trim() !== "") {
        const q = window.indecBusqueda.toLowerCase().trim();

                      <i class="fa-regular fa-calendar-plus text-xs"></i>

    function renderizar(forzarReconstruccion = false) {
      const contenedor = document.getElementById("dashboard-content");
      if (!contenedor) return;
      if (categoriaActiva === "calendario_licitaciones") {
        vistaMontadaActual = "calendario_licitaciones";
        contenedor.innerHTML = window.renderizarSeccionCalendarioMAE();
        return;
      }


      const listaDolar = datosGlobales.dolar_y_cambiario || [];
      const itemOficial = listaDolar.find(d => d && d.variable === "DOLAR_OFICIAL");
      const valorOficial = (itemOficial && itemOficial.valor > 0) ? itemOficial.valor : null;

      // Clave única de la vista actual para evitar destruir los <tv-heatmap> si ya están en pantalla
      const claveVista = categoriaActiva === "indices"
        ? `indices_${subIndiceActivo}`
        : (categoriaActiva === "cotizacion_bonos" ? `bonos_${curvaActiva}` : categoriaActiva);

      // 0. Si estamos en INFLACIÓN Y AJUSTE y el gráfico ya está en pantalla, solo actualizamos las tarjetas superiores sin destruir ni parpadear el gráfico
      if (!forzarReconstruccion && categoriaActiva === "inflacion_y_ajuste" && vistaMontadaActual === "inflacion_y_ajuste") {
        const gridInf = document.getElementById("grid-inflacion-cards");
        if (gridInf) {
          const itemsInf = (datosGlobales.inflacion_y_ajuste || []).filter(i => i && i.variable !== "BRECHA_CAMBIARIA");
          gridInf.innerHTML = itemsInf.map(item => crearTarjeta(item, "inflacion_y_ajuste", valorOficial)).join("");
          return;
        }
      }

      // 0b. Si estamos en COTIZACIÓN BONOS y no es reconstrucción forzada, no destruir el canvas de la curva
      if (!forzarReconstruccion && categoriaActiva === "cotizacion_bonos" && vistaMontadaActual === claveVista && chartCurvaInstance) {

    window.parsearCalendarioFullJSCliente = function(jsText) {
      const extraidos = [];
      if (!jsText || jsText.length < 50) return extraidos;
      const bloques = jsText.match(/\{[^{}]+\}/g) || [];
      bloques.forEach(b => {
        let fIso = "";
        const mND = b.match(/new\s+Date\s*\(\s*(20\d{2})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})/);
        if (mND) {
          const yr = parseInt(mND[1], 10);
          const mo = parseInt(mND[2], 10) + 1;
          const dy = parseInt(mND[3], 10);
          if (mo >= 1 && mo <= 12 && dy >= 1 && dy <= 31) {
            fIso = yr + "-" + String(mo).padStart(2, "0") + "-" + String(dy).padStart(2, "0");
          }
        }
        if (!fIso) {
          const mIso = b.match(/(?:start|fecha|date|dia)\s*[:=]\s*['"](20\d{2})[-/](\d{1,2})[-/](\d{1,2})/i);
          if (mIso) fIso = mIso[1] + "-" + String(mIso[2]).padStart(2, "0") + "-" + String(mIso[3]).padStart(2, "0");
        }
        if (!fIso) {
          const mLat = b.match(/(?:start|fecha|date|dia)\s*[:=]\s*['"](\d{1,2})[-/](\d{1,2})[-/](20\d{2})/i);
          if (mLat) fIso = mLat[3] + "-" + String(mLat[2]).padStart(2, "0") + "-" + String(mLat[1]).padStart(2, "0");
        }
        const mTit = b.match(/(?:title|titulo|descripcion|nombre|text)\s*[:=]\s*['"]([^'"]{6,})['"]/i);
        if (fIso && mTit) {
          const tmp = document.createElement("div");
          tmp.innerHTML = mTit[1];
          const limpio = (tmp.textContent || tmp.innerText || "").trim();
          if (limpio.length > 5) {
            extraidos.push({ fecha: fIso, hora: "16:00hs", publicacion: limpio, url: "https://www.indec.gob.ar/indec/web/Calendario-Fecha-0" });
          }
        }
      });
      return extraidos;
    };

          const mapArg = {};
          [...window.CALENDARIO_INDEC_MULTIMES, ...window.CALENDARIO_INDEC_DATA, ...resp.argentina].forEach(it => {
            if (it && it.fecha && it.publicacion) mapArg[it.fecha + "|" + it.publicacion] = it;
          });
          window.CALENDARIO_INDEC_DATA = Object.values(mapArg).sort((a, b) => a.fecha.localeCompare(b.fecha));
        }
        if (Array.isArray(resp.estados_unidos) && resp.estados_unidos.length > 0) {
          const mapUsa = {};
          [...window.CALENDARIO_USA_DATA, ...resp.estados_unidos].forEach(it => {
            if (it && it.fecha && it.evento) mapUsa[it.fecha + "|" + it.evento] = it;
          });
          window.CALENDARIO_USA_DATA = Object.values(mapUsa).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
        }
      }

      // 2. Extracción directa en vivo de https://www.indec.gob.ar/Scripts/CalendarioFull.js desde el navegador
      const urlIndecJS = "https://www.indec.gob.ar/Scripts/CalendarioFull.js";
      const proxiesIndec = [
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(urlIndecJS),
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(urlIndecJS),
        "https://corsproxy.io/?" + encodeURIComponent(urlIndecJS)
      ];
      for (const pUrl of proxiesIndec) {
        try {
          const rJs = await fetch(pUrl);
          if (rJs.ok) {
            const txtJs = await rJs.text();
            const evsIndec = window.parsearCalendarioFullJSCliente(txtJs);
            if (evsIndec.length > 0) {
              const mapA = {};
              [...window.CALENDARIO_INDEC_DATA, ...evsIndec].forEach(it => {
                mapA[it.fecha + "|" + it.publicacion] = it;
              });
              window.CALENDARIO_INDEC_DATA = Object.values(mapA).sort((a, b) => a.fecha.localeCompare(b.fecha));
              break;
            }
          }
        } catch (e) {}
      }

      // 3. Extracción directa en vivo de Investing / AWS ECS para EE.UU.
      const urlAws = "https://e1-0850197d5e074be58352ddc860645af6.ecs.us-east-1.on.aws/events?cee=no";
      const proxiesUsa = [
        urlAws,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(urlAws),
        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(urlAws)
      ];
      for (const u of proxiesUsa) {
        try {
          const rAws = await fetch(u);
          if (rAws.ok) {
            const dAws = await rAws.json();
            const arr = Array.isArray(dAws) ? dAws : (dAws.events || dAws.data || []);
            if (Array.isArray(arr) && arr.length > 0) {
              const mapU = {};
              window.CALENDARIO_USA_DATA.forEach(x => { mapU[x.fecha + "|" + x.evento] = x; });
              arr.forEach(ev => {
                const nom = String(ev.event || ev.title || ev.name || "").trim();
                const fRaw = String(ev.date || ev.fecha || ev.datetime || "").slice(0, 10);
                if (nom && fRaw.length === 10 && fRaw.startsWith("202")) {
                  mapU[fRaw + "|" + nom] = {
                    fecha: fRaw,
                    hora: String(ev.time || ev.hora || "10:30").slice(0, 5),
                    div: "US",
                    evento: nom,
                    importancia: Number(ev.importance || 2),
                    actual: String(ev.actual || "-"),
                    prevision: String(ev.forecast || "-"),
                    anterior: String(ev.previous || "-")
                  };
                }
              });
              window.CALENDARIO_USA_DATA = Object.values(mapU).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
              break;
            }
          }
        } catch (e) {}
      }

      if (categoriaActiva === "calendario_economico") renderizar(true);
    };

    function filtrarCategoria(cat, ev) {
      categoriaActiva = cat;
      document.querySelectorAll(".nav-tab").forEach(b => b.classList.remove("active"));
      if (ev && ev.currentTarget) ev.currentTarget.classList.add("active");
      renderizar(true);
    }

    actualizarPuntasDolarEnVivo();
    cargarDatos();
    actualizarCriptosEnVivo();
    sincronizarEndpointsSecundarios();
    window.sincronizarCalendarioEconomico();
    sincronizarLicitacionesA3();

    setInterval(actualizarCriptosEnVivo, 8000);
    setInterval(cargarDatos, 8000);
    setInterval(actualizarPuntasDolarEnVivo, 8000);
    setInterval(sincronizarEndpointsSecundarios, 15000);
    setInterval(() => { if (window.sincronizarCalendarioEconomico) window.sincronizarCalendarioEconomico(); }, 30000);
    setTimeout(() => { if (window.sincronizarCalendarioEconomico) window.sincronizarCalendarioEconomico(); }, 800);
  </script>
</body>
