    function parseNumSeguro(val) {
      if (val === undefined || val === null || val === "-") return NaN;
      if (typeof val === "number") return val;
      let s = String(val).replace(/[%$a-zA-Z\s]/g, "").trim();
      if (!s) return NaN;
      if (s.includes(",") && s.includes(".")) {
        s = s.replace(/\./g, "").replace(",", ".");
      } else if (s.includes(",")) {
        s = s.replace(",", ".");
      }
      const n = parseFloat(s);
      return isNaN(n) ? NaN : n;
    }

            const kMes = keys.find(k => /mes|periodo|fecha|label/i.test(k)) || keys[0];
            const kReal = keys.find(k => /ipc_real|indec|real_ipc|hist/i.test(k));
            const kImp = keys.find(k => /implicita|breakeven|break_even|mercado/i.test(k));
            const kNom = keys.find(k => /tem_nominal|tem_fija|lecap|nominal/i.test(k));
            const kCer = keys.find(k => /tem_real|tem_cer|cer_tem|tir_cer/i.test(k));
            const vReal = kReal ? parseNumSeguro(r[kReal]) : NaN;
            const vImp = kImp ? parseNumSeguro(r[kImp]) : NaN;
            const vNom = kNom ? parseNumSeguro(r[kNom]) : NaN;
            const vCer = kCer ? parseNumSeguro(r[kCer]) : NaN;
            return {
              mes: String(r[kMes] || `M${i + 1}`),
              ipc_real: !isNaN(vReal) ? vReal : null,
              inf_implicita: !isNaN(vImp) ? vImp : null,
              tem_nominal: !isNaN(vNom) ? vNom : null,
              tem_cer: !isNaN(vCer) ? vCer : null
            };
          });
        }
      }
      return SERIE_INFLACION_IMPLICITA_SJB;
    }

    // Extrae siempre la TIR Anualizada para que todos los puntos queden exactamente sobre la misma escala en la curva
    function extraerTIRParaCurva(fila) {
      const keys = Object.keys(fila);
      // 1. Prioridad absoluta: TIR o TEA
      const kTir = keys.find(k => /^tir$|^tea$|tir_anual|tir\s*\(%\)|tea\s*\(%\)|rendimiento/i.test(k.trim()))
        || keys.find(k => /tir|tea/i.test(k));
      if (kTir) {
        const v = parseNumSeguro(fila[kTir]);
        if (!isNaN(v) && v !== 0) return v;
      }
      // 2. Segunda opción: TNA
      const kTna = keys.find(k => /tna/i.test(k));
      if (kTna) {
        const vTna = parseNumSeguro(fila[kTna]);
        if (!isNaN(vTna) && vTna !== 0) return vTna;
      }
      // 3. Si sólo viene TEM mensual, anualizarla a TIR efectiva anual: ((1 + TEM/100)^12 - 1) * 100
      const kTem = keys.find(k => /tem/i.test(k));
      if (kTem) {
        const vTem = parseNumSeguro(fila[kTem]);
        if (!isNaN(vTem) && vTem > 0) {
          return +(((Math.pow(1 + vTem / 100, 12)) - 1) * 100).toFixed(2);
        }
      }
      return NaN;
    }

    function dibujarGraficoCurva() {
      const canvas = document.getElementById("canvas-curva-bonos");
      if (!canvas) return;
      if (chartCurvaInstance) {
        chartCurvaInstance.destroy();
        chartCurvaInstance = null;
      }

      const filas = obtenerFilasCurva(curvaActiva);
      const puntos = [];

      filas.forEach((f, idx) => {
        const keys = Object.keys(f);
        const kTicker = keys.find(k => /ticker|especie|bono|simbolo/i.test(k)) || keys[0];
        const kDias = keys.find(k => /^dias$|^días$|dias_vto|días_al_vencimiento|plazo/i.test(k.trim()))
          || keys.find(k => /dias|días/i.test(k));
        const kVto = keys.find(k => /vencimiento|vto|fecha/i.test(k));
        const kDur = keys.find(k => /^md$|duration|duracion/i.test(k));

        const ticker = String(f[kTicker] || `B${idx + 1}`).trim();
        let diasVal = kDias ? parseNumSeguro(f[kDias]) : NaN;

        if (isNaN(diasVal) && kVto && f[kVto]) {
          const sVto = String(f[kVto]).trim();
          let fVto = new Date(sVto);
          if (isNaN(fVto.getTime()) && /^\d{2}\/\d{2}\/\d{4}$/.test(sVto)) {
            const p = sVto.split("/");
            fVto = new Date(`${p[2]}-${p[1]}-${p[0]}`);
          }
          if (!isNaN(fVto.getTime())) {
            diasVal = Math.max(1, Math.round((fVto - new Date()) / (1000 * 60 * 60 * 24)));
          }
        }
        if (isNaN(diasVal) && kDur) {
          const dVal = parseNumSeguro(f[kDur]);
          if (!isNaN(dVal)) diasVal = Math.round(dVal * 365);
        }

        const yVal = extraerTIRParaCurva(f);
        if (!isNaN(diasVal) && !isNaN(yVal) && diasVal > 0 && yVal > -30 && yVal < 250) {
          puntos.push({ x: diasVal, y: yVal, ticker });
        }
      });

      puntos.sort((a, b) => a.x - b.x);

      // Regresión logarítmica y = a + b * ln(x) calculada sobre los puntos limpios
      const lineaTendencia = [];
      if (puntos.length >= 2) {
        const n = puntos.length;
        const xs = puntos.map(p => Math.log(Math.max(1, p.x)));
        const ys = puntos.map(p => p.y);
        const meanX = xs.reduce((a, b) => a + b, 0) / n;
        const meanY = ys.reduce((a, b) => a + b, 0) / n;
        let num = 0, den = 0;
        for (let i = 0; i < n; i++) {
          num += (xs[i] - meanX) * (ys[i] - meanY);
          den += (xs[i] - meanX) ** 2;
        }
        const b = den !== 0 ? num / den : 0;
        const a = meanY - b * meanX;

        const minX = Math.max(1, puntos[0].x);
        const maxX = puntos[puntos.length - 1].x;
        const pasos = 100;
        for (let i = 0; i <= pasos; i++) {
          const cx = minX + ((maxX - minX) * i) / pasos;
          const cy = a + b * Math.log(Math.max(1, cx));
          lineaTendencia.push({ x: +cx.toFixed(2), y: +cy.toFixed(2) });
        }
      }

      const ctx = canvas.getContext("2d");
      chartCurvaInstance = new Chart(ctx, {
        type: "scatter",
        data: {
          datasets: [
            {
              label: "Bonos",
              data: puntos,

              borderColor: "#3b82f6",
              borderWidth: 1,
              pointStyle: "circle",
              pointRadius: 5,
              pointHoverRadius: 7,
              order: 1
            },
            {
              label: "Tendencia",
              data: lineaTendencia,
              type: "line",
              borderColor: "#ef4444",
              backgroundColor: "transparent",
              borderWidth: 2,
              borderDash: [3, 3],
              pointStyle: "line",
              pointRadius: 0,
              pointHoverRadius: 0,
              fill: false,
              tension: 0.35,
              order: 2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 24, right: 16, left: 10, bottom: 8 } },
          plugins: {
            legend: {
              display: true,
              position: "right",
              align: "start",
              labels: {
                color: "#94a3b8",
                usePointStyle: true,
                boxWidth: 22,
                padding: 14,
                font: { family: "'Inter', sans-serif", size: 11 }
              }
            },
            tooltip: {
              backgroundColor: "rgba(20, 23, 28, 0.96)",
              borderColor: "rgba(255, 255, 255, 0.15)",
              borderWidth: 1,
              callbacks: {
                label(context) {
                  const raw = context.raw;
                  if (raw && raw.ticker) {
                    return `${raw.ticker} — TIR: ${raw.y.toFixed(2)}% (${raw.x} días)`;
                  }
                  return `Tendencia: ${raw.y.toFixed(2)}%`;
                }
              }
            }
          },
          scales: {
            x: {
              type: "linear",
              title: {
                display: true,
                text: "Días al Vencimiento",
                color: "#94a3b8",
                font: { family: "'Inter', sans-serif", size: 12, weight: "600" },
                padding: { top: 10 }
              },
              grid: { color: "rgba(255, 255, 255, 0.06)" },
              ticks: { color: "#64748b", font: { family: "'Inter', sans-serif", size: 10 } }
            },

    async function actualizarCriptosEnVivo() {
      try {
        const syms = '["BTCUSDT","ETHUSDT","SOLUSDT","PAXGUSDT","BNBUSDT","XRPUSDT","DOGEUSDT","ADAUSDT","USDCUSDT"]';
        const res = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=${syms}`);
        if (!res.ok) return;
        const tickers = await res.json();
        const mapBin = {};
        tickers.forEach(t => { mapBin[t.symbol] = t; });

        const fec = new Date().toLocaleTimeString();
        if (!datosGlobales.cripto) datosGlobales.cripto = [];

        CRIPTO_DIRECTAS.forEach(c => {
          let p = c.defP;
          let varStr = "+0.00%";
          if (c.sym && mapBin[c.sym]) {
            p = parseFloat(mapBin[c.sym].lastPrice);
            const chg = parseFloat(mapBin[c.sym].priceChangePercent);
            varStr = chg >= 0 ? `+${chg.toFixed(2)}%` : `${chg.toFixed(2)}%`;
          }

          let fmt = "";
          if (p >= 1000) {
            fmt = "US$ " + p.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          } else if (p >= 1) {
            fmt = "US$ " + p.toFixed(2);
          } else {
            fmt = "US$ " + p.toFixed(4);
          }

          let flashClass = "";
          if (PRECIOS_ANTERIORES[c.cod] !== undefined) {
            if (p > PRECIOS_ANTERIORES[c.cod]) flashClass = "flash-green";
            else if (p < PRECIOS_ANTERIORES[c.cod]) flashClass = "flash-red";
          }
          PRECIOS_ANTERIORES[c.cod] = p;
          FLASH_REGISTRO[c.cod] = flashClass;

          const idx = datosGlobales.cripto.findIndex(it => it.variable === c.cod);
          const itemObj = {
            variable: c.cod,
            descripcion: c.desc,
            categoria: "cripto",
            valor_formateado: fmt,
            variacion: varStr,
            valor: p,
            fecha: fec
          };

          if (idx >= 0) datosGlobales.cripto[idx] = itemObj;
          else datosGlobales.cripto.push(itemObj);
        });

        if (categoriaActiva === "cripto" || categoriaActiva === "home") {
          renderizar();
        }
      } catch (err) {
        console.warn("Binance stream:", err);
      }
    }

    function valorParaOrdenar(item, col) {
      const val = item[col];
      if (val === undefined || val === null || val === "-") return -999999;
      if (typeof val === "number") return val;
      const s = String(val).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return new Date(s).getTime();
      const numMatch = s.replace(",", ".").match(/-?\d+(\.\d+)?/);
      if (numMatch) return parseFloat(numMatch[0]);
      return s.toLowerCase();
    }

      if (!SORT_STATE[tablaKey]) {
        SORT_STATE[tablaKey] = { col: null, asc: true };

      const st = SORT_STATE[tablaKey];
      if (st.col === colKey) st.asc = !st.asc;
      else { st.col = colKey; st.asc = true; }

                  <span class="text-[10px] font-mono px-2 py-0.5 rounded-full ${subIndiceActivo === 'estados_unidos' ? 'bg-cyan-400 text-slate-950 font-bold' : 'bg-slate-800 text-slate-400'}">6</span>
                </button>

                <button onclick="cambiarSubIndice('sectores')" class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between border ${subIndiceActivo === 'sectores' ? 'bg-cyan-500/20 text-white border-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/80 border-slate-800/60'}">
                  <div class="flex items-center gap-2 truncate">
                    <i class="fa-solid fa-chart-pie text-amber-400 text-xs"></i>
                    <span class="text-xs font-semibold truncate">Sectores (SPDRs)</span>
                  </div>
                  <span class="text-[10px] font-mono px-2 py-0.5 rounded-full ${subIndiceActivo === 'sectores' ? 'bg-cyan-400 text-slate-950 font-bold' : 'bg-slate-800 text-slate-400'}">11</span>
                </button>
              </aside>

              <section class="flex-1 w-full space-y-4 overflow-hidden">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div class="flex items-center gap-2">
                    <i class="fa-solid ${infoSub.icono} ${infoSub.color} text-sm"></i>
                    <h3 class="text-xs font-bold text-white uppercase tracking-wider">${infoSub.titulo}</h3>
                  </div>
                  <span class="text-[11px] font-mono text-slate-400">${infoSub.desc}</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                  ${itemsSub.map(item => crearTarjeta(item, "indices", valorOficial)).join("")}
                </div>

                ${mapaCalorHtml}
              </section>
            </div>
          </div>
        `;
        return;
      }

      if (categoriaActiva === "cotizacion_bonos") {
        const infoCurva = CURVAS_INFO[curvaActiva] || { titulo: "Curva", desc: "", color: "text-cyan-400" };
        let filas = [...obtenerFilasCurva(curvaActiva)];

        const st = SORT_STATE[curvaActiva];
        if (st && st.col) {
          filas.sort((a, b) => {
            const va = valorParaOrdenar(a, st.col);
            const vb = valorParaOrdenar(b, st.col);
            if (typeof va === "string" && typeof vb === "string") {
              return st.asc ? va.localeCompare(vb) : vb.localeCompare(va);
            }
            return st.asc ? (va - vb) : (vb - va);
          });
        }

        let tablaHtml = "";
        if (filas && filas.length > 0) {
          const columnas = Object.keys(filas[0]);
          tablaHtml = `
            <table class="w-full text-left text-xs font-mono">
              <thead class="bg-slate-900/90 text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-800">
                <tr>
                  ${columnas.map(col => {
                    const cL = col.toLowerCase();
                    const al = cL.includes("ticker") ? "text-left" : (cL.includes("precio") || cL.includes("valor")) ? "text-right" : "text-center";
                    return renderTh(curvaActiva, col, col.toUpperCase(), al);
                  }).join("")}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60 text-slate-200">
                ${filas.map(b => {
                  return `
                  <tr class="table-dark-row transition">
                    ${columnas.map(col => {
                      const val = b[col];
                      const cL = col.toLowerCase();
                      if (cL.includes("ticker") || cL.includes("especie")) {
                        return `<td class="py-2.5 px-3 font-bold text-white tracking-wide">${val}</td>`;
                      }
                      if (cL.includes("precio") || cL.includes("valor")) {
                        const num = parseNumSeguro(val);
                        const formatted = !isNaN(num) ? (num >= 1000 ? '$ ' + num.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '$ ' + num.toFixed(2)) : val;
                        return `<td class="py-2.5 px-3 text-right font-medium text-slate-200">${formatted}</td>`;
                      }
                      if (cL.includes("var")) {
                        return `<td class="py-2.5 px-3 text-center">${renderFilaTerminal(val, "var")}</td>`;
                      }
                      if (cL.includes("tir") || cL.includes("tasa") || cL.includes("tea") || cL.includes("tna") || cL.includes("tem") || cL.includes("cupón") || cL.includes("paridad")) {
                        return `<td class="py-2.5 px-3 text-center">${renderFilaTerminal(val, "neutro")}</td>`;
                      }
                      return `<td class="py-2.5 px-3 text-center text-slate-300">${val ?? "-"}</td>`;
                    }).join("")}
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          `;
        }

        const cfgHeader = CONFIG_SECCIONES.cotizacion_bonos;

        contenedor.innerHTML = `
          <div class="space-y-4">
            ${renderizarBarraSeccion(cfgHeader)}
            <div class="flex flex-col lg:flex-row gap-5 items-start">
              <aside class="w-full lg:w-64 shrink-0 space-y-2 bg-[#090e1e]/90 border border-slate-800 rounded-2xl p-3 shadow-xl backdrop-blur-md">
                <div class="px-2 py-1.5 border-b border-slate-800/80 mb-2">
                  <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Clasificación de Curvas</span>
                </div>
                
                <button onclick="cambiarCurva('lecaps')" class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between border ${curvaActiva === 'lecaps' ? 'bg-cyan-500/20 text-white border-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/80 border-slate-800/60'}">
                  <div class="flex items-center gap-2 truncate">
                    <i class="fa-solid fa-money-bill-trend-up text-amber-400 text-xs"></i>
                    <span class="text-xs font-semibold truncate">Lecaps y Boncaps</span>
                  </div>
                </button>

                <button onclick="cambiarCurva('cer')" class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between border ${curvaActiva === 'cer' ? 'bg-cyan-500/20 text-white border-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/80 border-slate-800/60'}">
                  <div class="flex items-center gap-2 truncate">
                    <i class="fa-solid fa-arrow-trend-up text-purple-400 text-xs"></i>
                    <span class="text-xs font-semibold truncate">Bonos CER</span>
                  </div>
                </button>

                <button onclick="cambiarCurva('soberanos')" class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between border ${curvaActiva === 'soberanos' ? 'bg-cyan-500/20 text-white border-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/80 border-slate-800/60'}">
                  <div class="flex items-center gap-2 truncate">
                    <i class="fa-solid fa-file-invoice-dollar text-cyan-400 text-xs"></i>
                    <span class="text-xs font-semibold truncate">Soberanos en Dólares</span>
                  </div>
                </button>

                <button onclick="cambiarCurva('bopreales')" class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between border ${curvaActiva === 'bopreales' ? 'bg-cyan-500/20 text-white border-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/80 border-slate-800/60'}">
                  <div class="flex items-center gap-2 truncate">
                    <i class="fa-solid fa-shield-halved text-emerald-400 text-xs"></i>
                    <span class="text-xs font-semibold truncate">Bopreales BCRA</span>
                  </div>
                </button>

                <button onclick="cambiarCurva('dollar_linked')" class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between border ${curvaActiva === 'dollar_linked' ? 'bg-cyan-500/20 text-white border-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/80 border-slate-800/60'}">
                  <div class="flex items-center gap-2 truncate">
                    <i class="fa-solid fa-link text-emerald-400 text-xs"></i>
                    <span class="text-xs font-semibold truncate">Dollar Linked</span>
                  </div>
                </button>

                <button onclick="cambiarCurva('tamar')" class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between border ${curvaActiva === 'tamar' ? 'bg-cyan-500/20 text-white border-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/80 border-slate-800/60'}">
                  <div class="flex items-center gap-2 truncate">
                    <i class="fa-solid fa-chart-simple text-sky-400 text-xs"></i>
                    <span class="text-xs font-semibold truncate">Tasa TAMAR / Badlar</span>
                  </div>
                </button>

                <button onclick="cambiarCurva('duales')" class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between border ${curvaActiva === 'duales' ? 'bg-cyan-500/20 text-white border-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/80 border-slate-800/60'}">
                  <div class="flex items-center gap-2 truncate">
                    <i class="fa-solid fa-arrows-split-up-and-left text-rose-400 text-xs"></i>
                    <span class="text-xs font-semibold truncate">Bonos Duales</span>
                  </div>
                </button>
              </aside>

              <section class="flex-1 w-full space-y-5 overflow-hidden">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div class="flex items-center gap-2">
                    <i class="fa-solid ${infoCurva.icono} ${infoCurva.color} text-sm"></i>
                    <h3 class="text-xs font-bold text-white uppercase tracking-wider">${infoCurva.titulo} (${filas.length} Bonos)</h3>
                  </div>
                  <span class="text-[11px] font-mono text-slate-400">${infoCurva.desc} • Clic en columna para ordenar</span>
                </div>
                
                <div class="overflow-x-auto rounded-2xl border border-slate-800 bg-[#090e1e]/90 shadow-2xl backdrop-blur-md">
                  ${tablaHtml}
                </div>

                <div class="rounded-2xl sjb-chart-box p-6 space-y-4">
                  <div>
                    <h3 class="text-sm font-bold text-white tracking-wide">${infoCurva.titulo}</h3>
                  </div>
                  <div class="w-full h-[380px] relative">
                    <canvas id="canvas-curva-bonos"></canvas>
                  </div>
                </div>
              </section>
            </div>
          </div>
        `;

        setTimeout(dibujarGraficoCurva, 40);
        return;
      }

      // VISTA DE INFLACIÓN Y COEFICIENTES (Sin el detalle por tramos debajo)
      if (categoriaActiva === "inflacion_y_ajuste") {
        const items = (datosGlobales[categoriaActiva] || []).filter(i => i && i.variable !== "BRECHA_CAMBIARIA");
        const cfgHeader = CONFIG_SECCIONES.inflacion_y_ajuste;

        contenedor.innerHTML = `
          <div class="space-y-6">
            <section class="space-y-3">
              ${renderizarBarraSeccion(cfgHeader)}
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                ${items.map(item => crearTarjeta(item, "inflacion_y_ajuste", valorOficial)).join("")}
              </div>
            </section>

            <section class="rounded-2xl sjb-chart-box p-6 space-y-5">
              <div>
                <h2 class="text-sm font-bold text-white tracking-wide">Inflación Implícita del Mercado — CER vs Renta Fija</h2>
              </div>

              <div class="w-full h-[400px] relative">
                <canvas id="canvas-inflacion-implicita"></canvas>
              </div>
            </section>
          </div>
        `;

        setTimeout(dibujarGraficoInflacionImplicita, 40);
        return;
      }

      const items = (datosGlobales[categoriaActiva] || []).filter(i => i && i.variable !== "BRECHA_CAMBIARIA");
      const cfgHeader = CONFIG_SECCIONES[categoriaActiva] || {
        titulo: categoriaActiva.replace(/_/g, " ").toUpperCase(),
        sub: "Mercado en Tiempo Real",
        icono: "fa-circle-dot",
        barra: "section-bar-cyan",
        flare: "glow-flare-cyan",
        badge: "bg-cyan-500/20 border-cyan-400/40 text-cyan-300"
      };

      if (items.length === 0) {
        contenedor.innerHTML = '<div class="py-20 text-center text-slate-500 text-xs">Actualizando cotizaciones en tiempo real...</div>';
        return;
      }

      contenedor.innerHTML = `
        <section class="space-y-3">
          ${renderizarBarraSeccion(cfgHeader)}
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
            ${items.map(item => crearTarjeta(item, categoriaActiva, valorOficial)).join("")}
          </div>
        </section>
      `;
    }

    function crearTarjeta(item, categoria, valorOficial) {
      if (!item) return "";

      const variacion = String(item.variacion || "").replace(/Â/g, "").trim();
      let varBadge = "";
      
      if (variacion.includes("+")) {
        varBadge = `
          <span class="px-2 py-0.5 rounded-full border border-emerald-500/40 bg-emerald-950/40 text-emerald-300 font-mono text-[10px] font-semibold flex items-center gap-1 shadow-[0_0_8px_rgba(16,185,129,0.15)]">
            <span>↑</span><span>${variacion}</span>
          </span>
        `;
      } else if (variacion.includes("-") || variacion.includes("−")) {
        varBadge = `
          <span class="px-2 py-0.5 rounded-full border border-rose-500/40 bg-rose-950/40 text-rose-300 font-mono text-[10px] font-semibold flex items-center gap-1 shadow-[0_0_8px_rgba(244,63,94,0.15)]">
            <span>↓</span><span>${variacion}</span>
          </span>
        `;
      } else {
        varBadge = `
          <span class="px-2 py-0.5 rounded-full border border-slate-700/60 bg-slate-900/60 text-slate-300 font-mono text-[10px] font-medium">
            ${variacion || "0,0%"}
          </span>
        `;
      }

      let badgeBrecha = "";
      if (categoria === "dolar_y_cambiario" || item.categoria === "dolar_y_cambiario") {
        if (item.variable === "DOLAR_OFICIAL") {
          badgeBrecha = '<span class="text-[9px] uppercase font-bold text-sky-300 bg-sky-950/60 border border-sky-500/40 px-1.5 py-0.5 rounded tracking-wide shadow-sm">REF</span>';
        } else if (valorOficial && item.valor > 0) {
          const spread = ((item.valor / valorOficial) - 1) * 100;
          const signo = spread >= 0 ? "+" : "";
          badgeBrecha = `<span class="text-[10px] font-mono font-medium px-2 py-0.5 rounded-full border border-amber-500/50 bg-amber-950/40 text-amber-300 shadow-[0_0_8px_rgba(245,158,11,0.2)]">Brecha: ${signo}${spread.toFixed(1)}%</span>`;
        }
      }

      let desc = String(item.descripcion || "").replace(/Â/g, "").toUpperCase().trim();
      let valFmt = String(item.valor_formateado || item.valor || "-").replace(/Â/g, "").trim();
      const fecha = String(item.fecha || "").replace(/Â/g, "").trim();
      const animFlash = FLASH_REGISTRO[item.variable] || "";



      if (item.variable && item.variable.startsWith("TASA_")) {
        if (!valFmt.toUpperCase().includes("TNA")) valFmt = `${valFmt} TNA`;
      }

      const variablesPesos = [
        "RESULTADO_FISCAL", "RECAUDACION_TRIBUTARIA", "SALARIO_MINIMO",
        "JUBILACION_MINIMA", "CANASTA_BASICA_TOTAL", "CANASTA_BASICA_ALIMENTARIA"
      ];
      if (variablesPesos.includes(item.variable)) {
        if (!valFmt.startsWith("$")) valFmt = `$${valFmt}`;
      }

      if (item.variable === "RIESGO_PAIS") {
        if (!valFmt.toLowerCase().includes("puntos") && !valFmt.toLowerCase().includes("pb")) valFmt = `${valFmt} pb`;
      }

      return `
        <div class="neon-card rounded-2xl p-4 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-1.5">
              <span class="text-[11px] font-semibold text-slate-300 uppercase tracking-wider truncate" title="${desc}">${desc}</span>
              ${badgeBrecha}
            </div>
            <div class="mt-2">
              <span class="text-2xl font-bold tracking-tight text-white font-mono truncate ${animFlash}">${valFmt}</span>
            </div>
          </div>
          <div class="mt-4 pt-2 border-t border-slate-800/60 flex items-center justify-between text-[11px]">
            ${varBadge}
            <span class="text-slate-400 text-[10px] font-mono">${fecha}</span>
          </div>
        </div>
      `;
    }

    function filtrarCategoria(cat, ev) {
      categoriaActiva = cat;
      document.querySelectorAll(".nav-tab").forEach(b => {
        b.classList.remove("active");
      });

      if (ev && ev.currentTarget) {
        ev.currentTarget.classList.add("active");
      }
      renderizar();
    }

    cargarDatos();
    actualizarCriptosEnVivo();
    cargarCurvasSJB();
    cargarInflacionImplicita();
    cargarBandas();

    setInterval(actualizarCriptosEnVivo, 5000);
    setInterval(cargarDatos, 8000);
    setInterval(cargarCurvasSJB, 15000);
    setInterval(cargarInflacionImplicita, 15000);
    setInterval(cargarBandas, 15000);
  </script>
</body>
</html>
