    function parseNumSeguro(val) {
      if (val === undefined || val === null || val === "-") return NaN;
      if (typeof val === "number") return val;
      let s = String(val).replace(/[%$a-zA-Z\s]/g, "").trim();
      if (!s) return NaN;
      if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
      else if (s.includes(",")) s = s.replace(",", ".");
      const n = parseFloat(s);
      return isNaN(n) ? NaN : n;
    }

            const kCer = keys.find(k => /tem_real|tem_cer|cer_tem|tir_cer/i.test(k));
            const vReal = kReal ? parseNumSeguro(r[kReal]) : NaN;

            const vNom = kNom ? parseNumSeguro(r[kNom]) : NaN;

    function extraerTIRParaCurva(fila) {
      const keys = Object.keys(fila);
      const kTir = keys.find(k => /^tir$|^tea$|tir_anual|tir\s*\(%\)|tea\s*\(%\)|rendimiento/i.test(k.trim())) || keys.find(k => /tir|tea/i.test(k));
      if (kTir) {
        const v = parseNumSeguro(fila[kTir]);
        if (!isNaN(v) && v !== 0) return v;
      }
      const kTna = keys.find(k => /tna/i.test(k));
      if (kTna) {
        const vTna = parseNumSeguro(fila[kTna]);
        if (!isNaN(vTna) && vTna !== 0) return vTna;
      }
      const kTem = keys.find(k => /tem/i.test(k));
      if (kTem) {
        const vTem = parseNumSeguro(fila[kTem]);
        if (!isNaN(vTem) && vTem > 0) return +(((Math.pow(1 + vTem / 100, 12)) - 1) * 100).toFixed(2);
      }
      return NaN;
    }

    function dibujarGraficoCurva() {
      const canvas = document.getElementById("canvas-curva-bonos");
      if (!canvas) return;
      if (chartCurvaInstance) { chartCurvaInstance.destroy(); chartCurvaInstance = null; }

      const filas = obtenerFilasCurva(curvaActiva);
      const puntos = [];

      filas.forEach((f, idx) => {
        const keys = Object.keys(f);
        const kTicker = keys.find(k => /ticker|especie|bono|simbolo/i.test(k)) || keys[0];
        const kDias = keys.find(k => /^dias$|^días$|dias_vto|días_al_vencimiento|plazo/i.test(k.trim())) || keys.find(k => /dias|días/i.test(k));
        const kVto = keys.find(k => /vencimiento|vto|fecha/i.test(k));
        const kDur = keys.find(k => /^md$|duration|duracion/i.test(k));

        const ticker = String(f[kTicker] || `B${idx + 1}`).trim();
        let diasVal = kDias ? parseNumSeguro(f[kDias]) : NaN;

        if (isNaN(diasVal) && kVto && f[kVto]) {
          const sVto = String(f[kVto]).trim();
          let fVto = new Date(sVto);
          if (isNaN(fVto.getTime()) && /^\d{2}\/\d{2}\/\d{4}$/.test(sVto)) {
            const p = sVto.split("/");
            fVto = new Date(`${p[2]}-${p[1]}-${p[0]}`);
          }
          if (!isNaN(fVto.getTime())) diasVal = Math.max(1, Math.round((fVto - new Date()) / 86400000));
        }
        if (isNaN(diasVal) && kDur) {
          const dVal = parseNumSeguro(f[kDur]);
          if (!isNaN(dVal)) diasVal = Math.round(dVal * 365);
        }

        const yVal = extraerTIRParaCurva(f);
        if (!isNaN(diasVal) && !isNaN(yVal) && diasVal > 0 && yVal > -30 && yVal < 250) {
          puntos.push({ x: diasVal, y: yVal, ticker });
        }
      });

      puntos.sort((a, b) => a.x - b.x);

      const lineaTendencia = [];
      if (puntos.length >= 2) {
        const n = puntos.length;
        const xs = puntos.map(p => Math.log(Math.max(1, p.x)));
        const ys = puntos.map(p => p.y);
        const meanX = xs.reduce((a, b) => a + b, 0) / n;
        const meanY = ys.reduce((a, b) => a + b, 0) / n;
        let num = 0, den = 0;
        for (let i = 0; i < n; i++) {
          num += (xs[i] - meanX) * (ys[i] - meanY);
          den += (xs[i] - meanX) ** 2;
        }
        const b = den !== 0 ? num / den : 0;
        const a = meanY - b * meanX;
        const minX = Math.max(1, puntos[0].x);
        const maxX = puntos[puntos.length - 1].x;
        for (let i = 0; i <= 100; i++) {
          const cx = minX + ((maxX - minX) * i) / 100;
          lineaTendencia.push({ x: +cx.toFixed(2), y: +(a + b * Math.log(Math.max(1, cx))).toFixed(2) });
        }
      }

      chartCurvaInstance = new Chart(canvas.getContext("2d"), {
        type: "scatter",
        data: {
          datasets: [
            { label: "Bonos", data: puntos, backgroundColor: "#3b82f6", borderColor: "#3b82f6", borderWidth: 1, pointStyle: "circle", pointRadius: 5, pointHoverRadius: 7, order: 1 },
            { label: "Tendencia", data: lineaTendencia, type: "line", borderColor: "#ef4444", backgroundColor: "transparent", borderWidth: 2, borderDash: [3, 3], pointStyle: "line", pointRadius: 0, pointHoverRadius: 0, fill: false, tension: 0.35, order: 2 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          layout: { padding: { top: 24, right: 16, left: 10, bottom: 8 } },
          plugins: {
            legend: { display: true, position: "right", align: "start", labels: { color: "#94a3b8", usePointStyle: true, boxWidth: 22, padding: 14, font: { family: "'Inter', sans-serif", size: 11 } } },
            tooltip: {
              backgroundColor: "rgba(20, 23, 28, 0.96)", borderColor: "rgba(255, 255, 255, 0.15)", borderWidth: 1,
              callbacks: {
                label(ctx) {
                  const raw = ctx.raw;
                  return raw && raw.ticker ? `${raw.ticker} — TIR: ${raw.y.toFixed(2)}% (${raw.x} días)` : `Tendencia: ${raw.y.toFixed(2)}%`;
                }
              }
            }
          },
          scales: {
            x: { type: "linear", title: { display: true, text: "Días al Vencimiento", color: "#94a3b8", font: { family: "'Inter', sans-serif", size: 12, weight: "600" }, padding: { top: 10 } }, grid: { color: "rgba(255, 255, 255, 0.06)" }, ticks: { color: "#64748b", font: { family: "'Inter', sans-serif", size: 10 } } },
            y: { title: { display: true, text: "TIR (%)", color: "#94a3b8", font: { family: "'Inter', sans-serif", size: 12, weight: "600" }, padding: { bottom: 8 } }, grid: { color: "rgba(255, 255, 255, 0.06)" }, ticks: { color: "#64748b", font: { family: "'Inter', sans-serif", size: 10 }, callback: v => Number(v).toFixed(2) + "%" } }
          }

      const targetLicit = "https://api.marketdata.mae.com.ar/api/mercado/licitaciones?fechaDesde=" + dStr + "&fechaHasta=" + hStr;

        targetLicit,

        "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(targetLicit),
        "https://corsproxy.io/?" + encodeURIComponent(targetLicit)
      ];
      for (const u of puentes) {
        try {
          const r = await fetch(u);
          if (r.ok) {
            const dj = await r.json();
            const arr = Array.isArray(dj) ? dj : (dj.licitaciones || dj.data || dj.items || []);

              window.fusionarLicitacionesMAE(arr);

      window.cargandoLicitaciones = false;

    window.navegarCalendarioMAE = function(accion) {

        if (window.vistaCalendarioMAE === "agenda") d.setDate(d.getDate() + 7);

                  <div class="rounded-xl border border-slate-800 bg-[#060a16] p-4 space-y-2 font-mono text-xs shadow-md">
                    <h3 class="text-xs font-bold text-white uppercase tracking-wider mb-2 font-sans flex items-center gap-1.5"><i class="fa-solid fa-arrows-up-down text-purple-400 text-[11px]"></i> Diferencias con las bandas</h3>
                    <div class="flex items-center gap-2.5 text-slate-200"><span class="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold">▲</span><span>El dólar debería subir <strong class="text-emerald-400 font-extrabold text-sm">${fmt$(difSubir)} (${pctSubir.toFixed(2)}%)</strong> para llegar a la banda superior</span></div>
                    <div class="flex items-center gap-2.5 text-slate-200"><span class="w-5 h-5 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold">▼</span><span>El dólar debería bajar <strong class="text-amber-400 font-extrabold text-sm">${fmt$(difBajar)} (${pctBajar.toFixed(2)}%)</strong> para llegar a la banda inferior</span></div>
                  </div>
                </div>
              </div>
            </section>
          </div>`;
        return;
      }

      if (categoriaActiva === "indices") {
        const infoSub = window.SUB_INDICES_INFO[subIndiceActivo];
        const fuenteIndices = (datosGlobales.indices && datosGlobales.indices.length > 0) ? datosGlobales.indices : window.INDICES_ESTATICOS_BASE;
        const itemsSub = fuenteIndices.filter(item => {
          if (!item || item.variable === "BURCAP") return false;
          if (subIndiceActivo === "argentina") return item.subcategoria === "argentina" || ["MERVAL_ARS", "MERVAL_USD", "RIESGO_PAIS"].includes(item.variable);
          if (subIndiceActivo === "estados_unidos") return item.subcategoria === "estados_unidos" || ["INDICE_SP500", "INDICE_NASDAQ", "INDICE_VIX", "INDICE_DJI", "INDICE_RUSSELL", "MONEDA_DXY"].includes(item.variable);
          return item.subcategoria === "sectores" || (item.variable && item.variable.startsWith("SPDR_"));
        });

        let mapaCalorHtml = "";
        if (subIndiceActivo === "argentina") {
          mapaCalorHtml = `<div class="rounded-2xl border border-slate-800 bg-[#090e1e]/90 p-5 shadow-2xl space-y-3"><div class="border-b border-slate-800/70 pb-2.5 flex items-center justify-between"><div class="flex items-center gap-2"><i class="fa-solid fa-fire-flame-curved text-sky-400 text-sm"></i><h3 class="text-xs font-bold text-white uppercase tracking-wider">Mapa de Calor — Acciones Argentinas (AllAR)</h3></div></div><div class="w-full h-[600px] rounded-xl overflow-hidden border border-slate-800/80 bg-[#030712]"><tv-heatmap heatmap-type="stock" data-source="AllAR" grouping="sector" block-size="market_cap_basic" block-color="change" theme="dark" style="width: 100%; height: 100%;"></tv-heatmap></div></div>`;
        } else if (subIndiceActivo === "estados_unidos") {
          mapaCalorHtml = `<div class="rounded-2xl border border-slate-800 bg-[#090e1e]/90 p-5 shadow-2xl space-y-3"><div class="border-b border-slate-800/70 pb-2.5 flex items-center justify-between"><div class="flex items-center gap-2"><i class="fa-solid fa-fire-flame-curved text-blue-400 text-sm"></i><h3 class="text-xs font-bold text-white uppercase tracking-wider">Stock Heatmap — S&P 500 (SPX500)</h3></div></div><div class="w-full h-[600px] rounded-xl overflow-hidden border border-slate-800/80 bg-[#030712]"><tv-heatmap heatmap-type="stock" data-source="SPX500" grouping="sector" block-size="market_cap_basic" block-color="change" theme="dark" style="width: 100%; height: 100%;"></tv-heatmap></div></div>`;
        }

        contenedor.innerHTML = `
          <div class="space-y-4">
            ${renderizarBarraSeccion(window.CONFIG_SECCIONES.indices)}
            <div class="flex flex-col lg:flex-row gap-5 items-start">
              <aside class="w-full lg:w-64 shrink-0 space-y-2 bg-[#090e1e]/90 border border-slate-800 rounded-2xl p-3 shadow-xl">
                <div class="px-2 py-1.5 border-b border-slate-800/80 mb-2"><span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Clasificación</span></div>
                <button onclick="cambiarSubIndice('argentina')" class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between border ${subIndiceActivo === 'argentina' ? 'bg-cyan-500/20 text-white border-cyan-400' : 'text-slate-400 hover:text-white border-slate-800/60'}"><span class="text-xs font-semibold"><i class="fa-solid fa-landmark-flag text-sky-400 mr-2"></i>Argentina</span><span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-slate-800">3</span></button>
                <button onclick="cambiarSubIndice('estados_unidos')" class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between border ${subIndiceActivo === 'estados_unidos' ? 'bg-cyan-500/20 text-white border-cyan-400' : 'text-slate-400 hover:text-white border-slate-800/60'}"><span class="text-xs font-semibold"><i class="fa-solid fa-flag-usa text-blue-400 mr-2"></i>Estados Unidos</span><span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-slate-800">6</span></button>
                <button onclick="cambiarSubIndice('sectores')" class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center justify-between border ${subIndiceActivo === 'sectores' ? 'bg-cyan-500/20 text-white border-cyan-400' : 'text-slate-400 hover:text-white border-slate-800/60'}"><span class="text-xs font-semibold"><i class="fa-solid fa-chart-pie text-amber-400 mr-2"></i>Sectores (SPDRs)</span><span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-slate-800">11</span></button>
              </aside>
              <section class="flex-1 w-full space-y-4 overflow-hidden">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div class="flex items-center gap-2"><i class="fa-solid ${infoSub.icono} ${infoSub.color} text-sm"></i><h3 class="text-xs font-bold text-white uppercase tracking-wider">${infoSub.titulo}</h3></div>
                  
                </div>
                <div id="grid-indices-cards" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">${itemsSub.map(item => crearTarjeta(item, "indices", valorOficial)).join("")}</div>
                <div id="finviz-sectores-wrapper">${subIndiceActivo === "sectores" ? renderizarBloqueFinvizSectores() : ""}</div>
                ${mapaCalorHtml}
              </section>
            </div>
          </div>`;
        return;
      }

      if (categoriaActiva === "cotizacion_bonos") {
        const infoCurva = window.CURVAS_INFO[curvaActiva] || { titulo: "Curva", desc: "", color: "text-cyan-400" };
        let filas = [...obtenerFilasCurva(curvaActiva)];
        const st = SORT_STATE[curvaActiva];
        if (st && st.col) {
          filas.sort((a, b) => {
            const va = valorParaOrdenar(a, st.col), vb = valorParaOrdenar(b, st.col);
            return (typeof va === "string" && typeof vb === "string") ? (st.asc ? va.localeCompare(vb) : vb.localeCompare(va)) : (st.asc ? va - vb : vb - va);
          });
        }

        const columnas = filas.length > 0 ? Object.keys(filas[0]) : [];
        const tablaHtml = filas.length > 0 ? `
          <table class="w-full text-left text-xs font-mono">
            <thead class="bg-slate-900/90 text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-800">
              <tr>${columnas.map(col => renderTh(curvaActiva, col, col.toUpperCase(), /ticker/i.test(col) ? "text-left" : (/precio|valor/i.test(col) ? "text-right" : "text-center"))).join("")}</tr>
            </thead>
            <tbody class="divide-y divide-slate-800/60 text-slate-200">
              ${filas.map(b => `<tr class="table-dark-row transition">${columnas.map(col => {
                const val = b[col], cL = col.toLowerCase();
                if (cL.includes("ticker") || cL.includes("especie")) return `<td class="py-2.5 px-3 font-bold text-white">${val}</td>`;
                if (cL === "tramo") {
                  const colTramo = val === "Corto" ? "bg-emerald-950/60 text-emerald-300 border-emerald-500/40" : (val === "Mediano" ? "bg-sky-950/60 text-sky-300 border-sky-500/40" : "bg-purple-950/60 text-purple-300 border-purple-500/40");
                  return `<td class="py-2.5 px-3 text-center"><span class="px-2 py-0.5 rounded-full border text-[10px] font-bold uppercase ${colTramo}">${val}</span></td>`;
                }
                if (cL.includes("precio") || cL.includes("valor")) {
                  const num = parseNumSeguro(val);
                  const pref = curvaActiva === "us_treasuries" ? "US$ " : "$ ";
                  return `<td class="py-2.5 px-3 text-right font-medium text-slate-200">${!isNaN(num) ? (num >= 1000 ? pref + num.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : pref + num.toFixed(2)) : val}</td>`;
                }
                if (cL.includes("var")) return `<td class="py-2.5 px-3 text-center">${renderFilaTerminal(val, "var")}</td>`;
                if (/tir|tasa|tea|tna|tem|cupón|paridad/.test(cL)) return `<td class="py-2.5 px-3 text-center">${renderFilaTerminal(val, "neutro")}</td>`;
                return `<td class="py-2.5 px-3 text-center text-slate-300">${val ?? "-"}</td>`;
              }).join("")}</tr>`).join("")}
            </tbody>
          </table>` : "";

        const menuCurvas = [
          ["lecaps", "fa-money-bill-trend-up text-amber-400", "Lecaps y Boncaps"],
          ["cer", "fa-arrow-trend-up text-purple-400", "Bonos CER"],
          ["soberanos", "fa-file-invoice-dollar text-cyan-400", "Soberanos en Dólares"],
          ["bopreales", "fa-shield-halved text-emerald-400", "Bopreales BCRA"],
          ["dollar_linked", "fa-link text-emerald-400", "Dollar Linked"],
          ["tamar", "fa-chart-simple text-sky-400", "Tasa TAMAR / Badlar"],
          ["duales", "fa-arrows-split-up-and-left text-rose-400", "Bonos Duales"],
          ["us_treasuries", "fa-flag-usa text-blue-400", "Bonos del Tesoro EE.UU."]
        ];

        contenedor.innerHTML = `
          <div class="space-y-4">
            ${renderizarBarraSeccion(window.CONFIG_SECCIONES.cotizacion_bonos)}
            <div class="flex flex-col lg:flex-row gap-5 items-start">
              <aside class="w-full lg:w-64 shrink-0 space-y-2 bg-[#090e1e]/90 border border-slate-800 rounded-2xl p-3 shadow-xl">
                <div class="px-2 py-1.5 border-b border-slate-800/80 mb-2"><span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Clasificación de Curvas</span></div>
                ${menuCurvas.map(([k, ic, lbl]) => `<button onclick="cambiarCurva('${k}')" class="w-full text-left px-3 py-2.5 rounded-xl transition flex items-center gap-2 border ${curvaActiva === k ? 'bg-cyan-500/20 text-white border-cyan-400' : 'text-slate-400 hover:text-white border-slate-800/60'}"><i class="fa-solid ${ic} text-xs"></i><span class="text-xs font-semibold truncate">${lbl}</span></button>`).join("")}
              </aside>
              <section class="flex-1 w-full space-y-5 overflow-hidden">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                  <div class="flex items-center gap-2"><i class="fa-solid ${infoCurva.icono} ${infoCurva.color} text-sm"></i><h3 class="text-xs font-bold text-white uppercase tracking-wider">${infoCurva.titulo} (${filas.length} Bonos)</h3></div>
                  
                </div>
                <div class="overflow-x-auto rounded-2xl border border-slate-800 bg-[#090e1e]/90 shadow-2xl">${tablaHtml}</div>
                <div class="rounded-2xl sjb-chart-box p-6 space-y-4">
                  <h3 class="text-sm font-bold text-white tracking-wide">${infoCurva.titulo}</h3>
                  <div class="w-full h-[380px] relative"><canvas id="canvas-curva-bonos"></canvas></div>
                </div>
              </section>
            </div>
          </div>`;
        setTimeout(dibujarGraficoCurva, 40);
        return;
      }

      if (categoriaActiva === "inflacion_y_ajuste") {
        const items = (datosGlobales.inflacion_y_ajuste || []).filter(i => i && i.variable !== "BRECHA_CAMBIARIA");
        contenedor.innerHTML = `
          <div class="space-y-6">
            <section class="space-y-3">
              ${renderizarBarraSeccion(window.CONFIG_SECCIONES.inflacion_y_ajuste)}
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">${items.map(item => crearTarjeta(item, "inflacion_y_ajuste", valorOficial)).join("")}</div>
            </section>
            <section class="rounded-2xl sjb-chart-box p-6 space-y-5">
              <h2 class="text-sm font-bold text-white tracking-wide">Inflación Implícita del Mercado — CER vs Renta Fija</h2>
              <div class="w-full h-[400px] relative"><canvas id="canvas-inflacion-implicita"></canvas></div>
            </section>
          </div>`;
        setTimeout(dibujarGraficoInflacionImplicita, 40);
        return;
      }

      const items = (datosGlobales[categoriaActiva] || []).filter(i => i && i.variable !== "BRECHA_CAMBIARIA");
      const cfgHeader = window.CONFIG_SECCIONES[categoriaActiva] || window.CONFIG_SECCIONES.home;
      if (items.length === 0) {
        contenedor.innerHTML = '<div class="py-20 text-center text-slate-500 text-xs">Actualizando cotizaciones en tiempo real...</div>';
        return;
      }
      contenedor.innerHTML = `<section class="space-y-3">${renderizarBarraSeccion(cfgHeader)}<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">${items.map(item => crearTarjeta(item, categoriaActiva, valorOficial)).join("")}</div></section>`;
    }

    function filtrarCategoria(cat, ev) {
      categoriaActiva = cat;
      document.querySelectorAll(".nav-tab").forEach(b => b.classList.remove("active"));
      if (ev && ev.currentTarget) ev.currentTarget.classList.add("active");
      renderizar(true);
    }

    actualizarPuntasDolarEnVivo();
    cargarDatos();
    actualizarCriptosEnVivo();
    sincronizarEndpointsSecundarios();
    sincronizarLicitacionesA3();

    setInterval(actualizarCriptosEnVivo, 5000);
    setInterval(cargarDatos, 8000);
    setInterval(actualizarPuntasDolarEnVivo, 10000);
    setInterval(sincronizarEndpointsSecundarios, 15000);
  </script>
</body>
</html>
